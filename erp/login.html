<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050816">
<title>登录 - 网研ERP</title>
<script>
(function () {
  if (window.top === window) return;

<style>
  :root{color-scheme:dark;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#050816;color:#eef6ff;--cyan:#38d7ff;--blue:#5578ff;--muted:#8292ad}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 12%,rgba(47,103,255,.18),transparent 30%),radial-gradient(circle at 82% 86%,rgba(14,210,232,.12),transparent 31%),#050816}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
  .glow{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.24;animation:glowFloat 8s ease-in-out infinite alternate}.glow-one{top:-260px;right:2%;background:#285eff}.glow-two{bottom:-290px;left:3%;background:#00cbd7;animation-delay:-4s}
  .tech-grid{position:fixed;left:-20%;right:-20%;bottom:-43%;height:92%;pointer-events:none;opacity:.38;background-image:linear-gradient(rgba(44,205,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(44,205,255,.22) 1px,transparent 1px);background-size:58px 38px;transform:perspective(480px) rotateX(58deg);transform-origin:center top;animation:gridFlow 3.2s linear infinite;mask-image:linear-gradient(to bottom,transparent 2%,black 48%,transparent 92%)}
  .orbit{position:fixed;width:360px;height:360px;border:1px solid rgba(54,203,255,.14);border-radius:50%;pointer-events:none;animation:orbitSpin 18s linear infinite}.orbit::before,.orbit::after{content:"";position:absolute;border-radius:50%}.orbit::before{inset:36px;border:1px dashed rgba(80,128,255,.17)}.orbit::after{width:8px;height:8px;top:47px;left:54px;background:#39dfff;box-shadow:0 0 18px #39dfff}.orbit-left{left:-150px;top:10%}.orbit-right{right:-160px;bottom:5%;width:410px;height:410px;animation-direction:reverse;animation-duration:24s}
  .circuit{position:fixed;width:230px;height:180px;pointer-events:none;opacity:.42;background:linear-gradient(90deg,transparent 0 10%,rgba(48,208,255,.32) 10% 10.5%,transparent 10.5% 52%,rgba(48,208,255,.22) 52% 52.5%,transparent 52.5%),linear-gradient(0deg,transparent 0 26%,rgba(48,208,255,.28) 26% 26.8%,transparent 26.8% 72%,rgba(82,111,255,.25) 72% 72.8%,transparent 72.8%)}
  .circuit::before,.circuit::after{content:"";position:absolute;width:7px;height:7px;border:1px solid #36d4ff;border-radius:50%;box-shadow:0 0 12px rgba(54,212,255,.8);animation:nodePulse 2.4s ease-in-out infinite}.circuit::before{left:20px;top:43px}.circuit::after{right:104px;bottom:45px;animation-delay:-1.2s}.circuit-left{left:5%;top:21%}.circuit-right{right:4%;bottom:18%;transform:rotate(180deg)}
  .particle{position:fixed;width:3px;height:3px;border-radius:50%;background:#52e4ff;box-shadow:0 0 9px #52e4ff;pointer-events:none;opacity:.65;animation:particleRise 7s linear infinite}.p1{left:12%;top:76%;animation-delay:-1s}.p2{left:27%;top:28%;animation-delay:-5s}.p3{right:19%;top:20%;animation-delay:-3s}.p4{right:11%;top:69%;animation-delay:-6s}.p5{left:49%;top:8%;animation-delay:-2s}
  .shell{position:relative;z-index:1;width:min(438px,100%);padding:34px 36px 24px;overflow:hidden;border:1px solid rgba(95,207,255,.31);border-radius:24px;background:linear-gradient(145deg,rgba(14,24,48,.94),rgba(5,12,28,.93));box-shadow:0 32px 90px rgba(0,0,0,.52),0 0 42px rgba(26,151,255,.1),inset 0 1px rgba(255,255,255,.055);backdrop-filter:blur(22px)}
  .shell::before{content:"";position:absolute;top:0;left:16%;width:68%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 24px rgba(56,215,255,.82)}
  .scan-beam{position:absolute;z-index:0;left:0;right:0;top:-18%;height:90px;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(48,207,255,.045),rgba(48,207,255,.16),rgba(48,207,255,.035),transparent);animation:scanCard 4.8s ease-in-out infinite}.shell>header,.shell>.divider,.shell>section,.shell>footer{position:relative;z-index:1}
  .corner{position:absolute;z-index:2;width:18px;height:18px;pointer-events:none}.corner::before,.corner::after{content:"";position:absolute;background:#42dfff;box-shadow:0 0 10px rgba(66,223,255,.9)}.corner::before{width:18px;height:1px}.corner::after{width:1px;height:18px}.corner-tl{left:11px;top:11px}.corner-tr{right:11px;top:11px;transform:rotate(90deg)}.corner-br{right:11px;bottom:11px;transform:rotate(180deg)}.corner-bl{left:11px;bottom:11px;transform:rotate(270deg)}
  .brand-row{display:flex;align-items:center;gap:13px}.brand-mark{position:relative;width:44px;height:44px;flex:0 0 44px;transform:rotate(45deg);border:1px solid rgba(56,215,255,.72);border-radius:12px;background:linear-gradient(135deg,rgba(56,215,255,.16),rgba(85,120,255,.14));box-shadow:0 0 22px rgba(56,215,255,.12),inset 0 0 18px rgba(56,215,255,.07)}
  .brand-mark::before,.brand-mark::after{content:"";position:absolute;border:1px solid rgba(135,235,255,.72);border-radius:5px}.brand-mark::before{inset:10px;animation:logoPulse 2.8s ease-in-out infinite}.brand-mark::after{inset:17px;background:var(--cyan);border:0;box-shadow:0 0 10px var(--cyan);animation:corePulse 1.8s ease-in-out infinite}
  .brand-copy{min-width:0}.brand-name{font-size:20px;font-weight:800;letter-spacing:.08em;white-space:nowrap}.edition{display:block;margin-top:3px;color:#63809f;font:600 9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.22em}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;color:#68819c;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;white-space:nowrap}.status-dot{width:6px;height:6px;border-radius:50%;background:#31e6b0;box-shadow:0 0 10px rgba(49,230,176,.9);animation:pulse 2.4s ease-in-out infinite}
  .divider{height:1px;margin:28px 0;background:linear-gradient(90deg,rgba(104,146,188,.24),rgba(104,146,188,.06))}.heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:21px}h1{margin:0;font-size:25px;line-height:1.2;letter-spacing:.05em}.sub{margin:0;color:#5e7491;font-size:12px;letter-spacing:.08em}
  .field{position:relative;margin-bottom:15px}.field svg{position:absolute;left:15px;top:50%;width:17px;height:17px;transform:translateY(-50%);fill:none;stroke:#5f7694;stroke-width:1.6;transition:.2s}
  input{width:100%;height:50px;padding:0 44px;border:1px solid rgba(117,150,185,.18);border-radius:12px;outline:none;background:rgba(2,8,20,.52);color:#eef6ff;font-size:14px;letter-spacing:.03em;transition:border-color .2s,box-shadow .2s,background .2s}input::placeholder{color:#53647c}input:focus{border-color:rgba(56,215,255,.58);background:rgba(4,13,28,.72);box-shadow:0 0 0 3px rgba(56,215,255,.07),0 0 20px rgba(56,215,255,.05)}.field:focus-within svg{stroke:var(--cyan)}
  .captcha-line{display:grid;grid-template-columns:minmax(0,1fr) 140px 40px;gap:8px;margin-bottom:15px}.captcha-line input{padding:0 14px;text-transform:uppercase}.captcha-image{width:140px;height:50px;display:block;border:1px solid rgba(56,215,255,.22);border-radius:11px;background:#071226;object-fit:cover}.captcha-refresh{width:40px;height:50px;border:1px solid rgba(117,150,185,.2);border-radius:11px;background:rgba(5,15,32,.8);color:#55dfff;font-size:20px;cursor:pointer;transition:.2s}.captcha-refresh:hover{border-color:rgba(56,215,255,.58);background:rgba(15,38,67,.9);box-shadow:0 0 15px rgba(56,215,255,.1);transform:rotate(45deg)}
  .hint{display:none;margin:-3px 2px 13px;color:#69809b;font-size:11px}.register-mode .hint{display:block}.message{min-height:21px;margin:0 2px 8px;color:#ff7b8e;font-size:12px;line-height:1.5}
  .primary{position:relative;width:100%;height:50px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(116,216,255,.5);border-radius:12px;background:linear-gradient(115deg,#315ce5,#168fd1,#315ce5);background-size:220% 100%;color:#fff;font-size:14px;font-weight:700;letter-spacing:.12em;cursor:pointer;box-shadow:0 12px 30px rgba(28,92,211,.28),0 0 18px rgba(39,184,255,.12),inset 0 1px rgba(255,255,255,.2);transition:transform .2s,filter .2s,box-shadow .2s;animation:buttonFlow 4s linear infinite}.primary::before{content:"";position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:buttonScan 2.8s ease-in-out infinite}.primary:hover{filter:brightness(1.15);box-shadow:0 15px 34px rgba(28,119,211,.38),0 0 28px rgba(39,184,255,.2),inset 0 1px rgba(255,255,255,.24)}.primary:active{transform:translateY(1px)}.primary:disabled{cursor:wait;opacity:.62;filter:none}.button-arrow{font-size:18px;font-weight:400;line-height:1}
  .switch{display:block;margin:14px auto 0;padding:7px;border:0;background:transparent;color:#6f89a8;font-size:12px;cursor:pointer;transition:color .2s}.switch:hover{color:#65dfff}.auth-hidden{display:none!important}.email-suffix-helper{display:flex;align-items:center;gap:6px;overflow-x:auto;margin:-7px 2px 12px;padding:2px 0 3px;scrollbar-width:thin}.email-suffix-label{flex:0 0 auto;color:#5f7591;font-size:10px;letter-spacing:.05em}.email-suffix-btn{flex:0 0 auto;height:26px;padding:0 9px;border:1px solid rgba(88,177,214,.2);border-radius:8px;background:rgba(5,15,32,.72);color:#7fcce6;font-size:10px;cursor:pointer;white-space:nowrap;transition:.18s}.email-suffix-btn:hover,.email-suffix-btn:focus-visible{border-color:rgba(56,215,255,.55);color:#b7efff;outline:none;box-shadow:0 0 0 2px rgba(56,215,255,.08)}.email-suffix-btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}.invite-help{margin:-7px 2px 13px;color:#6f829c;font-size:11px;line-height:1.55}.invite-help strong{color:#91dff4;font-weight:600}.tenant-select{width:100%;height:50px;padding:0 14px;border:1px solid rgba(56,215,255,.18);border-radius:11px;background:rgba(5,15,32,.85);color:#dcecff;outline:none}.tenant-select:focus{border-color:rgba(56,215,255,.55)}.email-code-line{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px;margin-bottom:15px}.email-code-line input{padding:0 14px}.code-send{height:50px;border:1px solid rgba(56,215,255,.3);border-radius:11px;background:rgba(5,15,32,.85);color:#66dfff;font-size:12px;cursor:pointer}.code-send:disabled{opacity:.55;cursor:wait}.mode-links{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.mode-links .switch{margin:10px 0 0}.footer{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;padding-top:19px;border-top:1px solid rgba(104,146,188,.1);color:#4d617a;font:500 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em}.footer span{color:#24405b}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1;box-shadow:0 0 15px rgba(49,230,176,1)}}
  @keyframes glowFloat{to{transform:translate3d(45px,30px,0) scale(1.08)}}
  @keyframes gridFlow{to{background-position:0 38px}}
  @keyframes orbitSpin{to{transform:rotate(360deg)}}
  @keyframes nodePulse{50%{transform:scale(1.7);opacity:.35}}
  @keyframes particleRise{0%{transform:translateY(60px);opacity:0}18%,78%{opacity:.72}100%{transform:translateY(-130px);opacity:0}}
  @keyframes scanCard{0%,8%{transform:translateY(0);opacity:0}18%{opacity:1}72%{opacity:.8}92%,100%{transform:translateY(590px);opacity:0}}
  @keyframes logoPulse{50%{inset:8px;border-color:#67e9ff;box-shadow:0 0 14px rgba(56,215,255,.28)}}
  @keyframes corePulse{50%{transform:scale(1.35);box-shadow:0 0 18px var(--cyan)}}
  @keyframes buttonFlow{to{background-position:220% 0}}
  @keyframes buttonScan{0%,34%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
  @media(max-width:760px){.circuit{display:none}.orbit{opacity:.55}.orbit-left{left:-260px}.orbit-right{right:-290px}.tech-grid{opacity:.25}}
  @media(max-width:520px){body{padding:16px}.shell{padding:30px 24px 22px;border-radius:20px}.divider{margin:25px 0}.heading{margin-bottom:19px}.captcha-line{grid-template-columns:minmax(0,1fr) 112px 38px;gap:6px}.captcha-image{width:112px}.captcha-refresh{width:38px}}
  @media(prefers-reduced-motion:reduce){.glow,.tech-grid,.orbit,.particle,.status-dot,.scan-beam,.brand-mark::before,.brand-mark::after,.primary,.primary::before,.circuit::before,.circuit::after{animation:none}}
</style>
</head>
<body>
<div class="glow glow-one" aria-hidden="true"></div><div class="glow glow-two" aria-hidden="true"></div>
<div class="tech-grid" aria-hidden="true"></div>
<div class="orbit orbit-left" aria-hidden="true"></div><div class="orbit orbit-right" aria-hidden="true"></div>
<div class="circuit circuit-left" aria-hidden="true"></div><div class="circuit circuit-right" aria-hidden="true"></div>
<i class="particle p1" aria-hidden="true"></i><i class="particle p2" aria-hidden="true"></i><i class="particle p3" aria-hidden="true"></i><i class="particle p4" aria-hidden="true"></i><i class="particle p5" aria-hidden="true"></i>
<main class="shell" aria-labelledby="loginTitle">
  <i class="scan-beam" aria-hidden="true"></i><i class="corner corner-tl" aria-hidden="true"></i><i class="corner corner-tr" aria-hidden="true"></i><i class="corner corner-br" aria-hidden="true"></i><i class="corner corner-bl" aria-hidden="true"></i>
  <header class="brand-row">
    <div class="brand-mark" aria-hidden="true"></div>
    <div class="brand-copy"><div class="brand-name" id="brandName">网研ERP</div><span class="edition" id="platformName">OZON</span></div>
    <div class="status"><i class="status-dot"></i>系统运行正常</div>
  </header>
  <div class="divider"></div>
  <section id="formSide">
    <div class="heading"><h1 id="loginTitle">登录</h1><p class="sub" id="formSub">邮箱 + 密码</p></div>
    <form id="authForm" novalidate>
      <label class="sr-only" for="identifier">邮箱</label>
      <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg><input id="identifier" name="identifier" placeholder="邮箱" autocomplete="username" maxlength="240" required autofocus></div>
      <div class="email-suffix-helper" id="emailSuffixHelper" role="group" aria-label="常用邮箱后缀快捷选择"><span class="email-suffix-label">常用后缀</span><button class="email-suffix-btn" type="button" data-email-suffix="qq.com">@qq.com</button><button class="email-suffix-btn" type="button" data-email-suffix="163.com">@163.com</button><button class="email-suffix-btn" type="button" data-email-suffix="126.com">@126.com</button><button class="email-suffix-btn" type="button" data-email-suffix="gmail.com">@gmail.com</button><button class="email-suffix-btn" type="button" data-email-suffix="outlook.com">@outlook.com</button></div>
      <div id="tenantSelectWrap" class="auth-hidden">
        <label class="sr-only" for="tenantSelect">选择企业</label>
        <div class="field"><select id="tenantSelect" class="tenant-select"><option value="">请选择要进入的企业</option></select></div>
      </div>
      <div id="passwordWrap">
        <label class="sr-only" for="password">密码</label>
        <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path></svg><input id="password" name="password" type="password" placeholder="密码" autocomplete="current-password" maxlength="128"></div>
      </div>
      <div id="emailCodeWrap" class="auth-hidden">
        <label class="sr-only" for="emailCode">邮箱验证码</label>
        <div class="email-code-line"><input id="emailCode" name="emailCode" inputmode="numeric" placeholder="6位邮箱验证码" autocomplete="one-time-code" maxlength="6"><button class="code-send" id="sendEmailCode" type="button">获取验证码</button></div>
      </div>
      <div id="inviteCodeWrap" class="auth-hidden">
        <label class="sr-only" for="inviteCode">邀请码（选填）</label>
        <div class="field"><input id="inviteCode" name="inviteCode" placeholder="邀请码（选填，例如 WYXXXXXXXXXX）" autocomplete="off" maxlength="12"></div>
        <p class="invite-help" id="inviteCodeHelp">邀请码由邀请你的网研ERP用户在会员中心<strong>“邀请好友”</strong>获取；没有邀请码可留空正常注册。</p>
      </div>
      <div id="captchaWrap" class="captcha-line auth-hidden">
        <input id="captchaAnswer" name="captchaAnswer" placeholder="图形验证码" autocomplete="off" maxlength="6">
        <img class="captcha-image" id="captchaImage" alt="验证码图片">
        <button class="captcha-refresh" id="refreshCaptcha" type="button" aria-label="刷新验证码">↻</button>
      </div>
      <div class="hint" id="formHint">正常登录使用邮箱 + 密码；首次、新设备或安全异常时会追加邮箱验证。</div>
      <div class="message" id="message" role="alert" aria-live="polite"></div>
      <button class="primary" id="submitBtn" type="submit"><span id="submitText">登录</span><span class="button-arrow" aria-hidden="true">→</span></button>
    </form>
    <div class="mode-links">
      <button class="switch" id="switchMode" type="button">首次使用 · 创建账号</button>
      <button class="switch" id="forgotPassword" type="button">忘记密码 · 验证码登录</button>
    </div>
  </section>
  <footer class="footer">安全连接 <span>·</span> 数据仅登录账号可见</footer>
</main>
<script src="assets/brand.js"></script>
<script>
(function () {
  'use strict';
  var mode = 'login';
  var pendingPassword = '';
  var captchaId = '';
  var codeTimer = null;
  var formSide = document.getElementById('formSide');
  var form = document.getElementById('authForm');
  var identifier = document.getElementById('identifier');
  var emailSuffixButtons = Array.prototype.slice.call(document.querySelectorAll('[data-email-suffix]'));
  var tenantSelectWrap = document.getElementById('tenantSelectWrap');
  var tenantSelect = document.getElementById('tenantSelect');
  var passwordWrap = document.getElementById('passwordWrap');
  var password = document.getElementById('password');
  var emailCodeWrap = document.getElementById('emailCodeWrap');
  var emailCode = document.getElementById('emailCode');
  var inviteCodeWrap = document.getElementById('inviteCodeWrap');
  var inviteCode = document.getElementById('inviteCode');
  var sendEmailCode = document.getElementById('sendEmailCode');
  var captchaWrap = document.getElementById('captchaWrap');
  var captchaAnswer = document.getElementById('captchaAnswer');
  var captchaImage = document.getElementById('captchaImage');
  var refreshCaptcha = document.getElementById('refreshCaptcha');
  var title = document.getElementById('loginTitle');
  var sub = document.getElementById('formSub');
  var hint = document.getElementById('formHint');
  var message = document.getElementById('message');
  var submit = document.getElementById('submitBtn');
  var submitText = document.getElementById('submitText');
  var switchMode = document.getElementById('switchMode');
  var forgotPassword = document.getElementById('forgotPassword');
  var brand = window.WYERP_BRAND || { name: '网研ERP', platform: 'OZON版' };

  document.title = '登录 - ' + brand.name;
  document.getElementById('brandName').textContent = brand.name;
  document.getElementById('platformName').textContent = (brand.platform || 'OZON').replace('版', '').toUpperCase();

  function safeNext() {
    var value = new URLSearchParams(location.search).get('next') || '/workspace.html?open=%2Findex.html';
    if (value.charAt(0) !== '/' || value.indexOf('//') === 0 || /^\/login\.html(?:[?#]|$)/i.test(value)) return '/workspace.html?open=%2Findex.html';
    try {
      var target = new URL(value, location.origin);
      if (target.origin !== location.origin) return '/workspace.html?open=%2Findex.html';
      if (target.searchParams.get('workspace') === '1') {
        target.searchParams.delete('workspace');
        var route = target.pathname + (target.search ? target.search : '') + (target.hash ? target.hash : '');
        return '/workspace.html?open=' + encodeURIComponent(route);
      }
    } catch (error) { return '/workspace.html?open=%2Findex.html'; }
    return value;
  }

  function isAdminIdentifier() {
    return mode === 'login' && identifier.value.trim().toLowerCase() === 'admin';
  }

  function setHidden(node, hidden) {
    node.classList.toggle('auth-hidden', hidden);
  }

  function selectedTenantId() {
    return tenantSelectWrap.classList.contains('auth-hidden') ? '' : String(tenantSelect.value || '').trim();
  }

  function showTenantChoices(items) {
    var rows = Array.isArray(items) ? items : [];
    tenantSelect.innerHTML = '<option value="">请选择要进入的企业</option>' + rows.map(function (item) {
      var name = String(item.tenantName || item.displayName || ('企业 ' + item.tenantId));
      return '<option value="' + String(item.tenantId || '') + '">' + name.replace(/[&<>"]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }) + '</option>';
    }).join('');
    setHidden(tenantSelectWrap, !rows.length);
  }

  function applyEmailSuffix(suffix) {
    if (identifier.readOnly) return;
    var raw = String(identifier.value || '').trim();
    var at = raw.indexOf('@');
    var local = String(at >= 0 ? raw.slice(0, at) : raw).trim();
    if (!local) { identifier.focus(); return; }
    identifier.value = local + '@' + suffix;
    try { identifier.dispatchEvent(new Event('input', { bubbles:true })); } catch (error) {}
    identifier.focus();
    try { identifier.setSelectionRange(identifier.value.length, identifier.value.length); } catch (error) {}
  }

  emailSuffixButtons.forEach(function (button) {
    button.addEventListener('click', function () { applyEmailSuffix(String(button.getAttribute('data-email-suffix') || '')); });
  });

  function setMode(nextMode, options) {
    mode = nextMode;
    options = options || {};
    message.textContent = options.message || '';
    emailCode.value = '';
    clearInterval(codeTimer);
    codeTimer = null;
    sendEmailCode.disabled = false;
    sendEmailCode.textContent = '获取验证码';

    var registering = mode === 'register';
    var recovering = mode === 'recovery';
    var verifying = mode === 'verify';
    formSide.classList.toggle('register-mode', registering);

    title.textContent = registering ? '创建账号' : recovering ? '验证码登录' : verifying ? '安全验证' : '登录';
    sub.textContent = registering ? '邮箱 + 密码 + 验证码' : recovering ? '忘记密码也能验证身份' : verifying ? '确认是你本人' : '邮箱 + 密码';
    hint.textContent = registering
      ? '注册必须验证邮箱并设置密码。'
      : recovering
        ? '验证码可以证明身份并直接登录；登录后建议尽快修改密码。'
        : verifying
          ? '首次登录、新设备或安全异常需要额外邮箱验证。'
          : '正常登录只需要邮箱 + 密码。';

    setHidden(passwordWrap, recovering || verifying);
    setHidden(emailCodeWrap, !(registering || recovering || verifying));
    setHidden(inviteCodeWrap, !registering);
    setHidden(captchaWrap, true);
    password.autocomplete = registering ? 'new-password' : 'current-password';
    identifier.readOnly = verifying;
    emailSuffixButtons.forEach(function (button) { button.disabled = verifying; });
    identifier.placeholder = '邮箱';
    if (registering || mode === 'login') showTenantChoices([]);

    submitText.textContent = registering ? '创建并登录' : recovering ? '验证并登录' : verifying ? '完成验证' : '登录';
    switchMode.textContent = registering ? '返回登录' : '首次使用 · 创建账号';
    forgotPassword.textContent = recovering ? '返回密码登录' : '忘记密码 · 验证码登录';
  }

  function setBusy(busy) {
    submit.disabled = busy;
    if (busy) submitText.textContent = mode === 'register' ? '正在创建' : '正在验证';
    else setMode(mode, { message: message.textContent });
  }

  function loadCaptcha() {
    captchaId = '';
    captchaAnswer.value = '';
    captchaImage.removeAttribute('src');
    fetch('/api/auth/captcha', { credentials:'same-origin',cache:'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('captcha');
      return res.json();
    }).then(function (data) {
      var nextId = String(data.id || '');
      var nextImage = String(data.image || '');
      if (!/^[0-9a-f-]{36}$/i.test(nextId) || nextImage.indexOf('data:image/svg+xml;base64,') !== 0 || nextImage.length > 100000) throw new Error('captcha');
      captchaId = nextId;
      captchaImage.src = nextImage;
    }).catch(function () { message.textContent = '图形验证码加载失败，请刷新。'; });
  }

  // The admin endpoint requires a valid captcha on the FIRST request.
  // Show and request the challenge when entering "admin", not after a failed login.
  function showAdminCaptchaOnTyping() {
    var admin = isAdminIdentifier();
    var currentlyHidden = captchaWrap.classList.contains('auth-hidden');
    if (admin) {
      if (currentlyHidden || !captchaId) {
        setHidden(captchaWrap, false);
        loadCaptcha();
      }
    } else if (!currentlyHidden) {
      setHidden(captchaWrap, true);
      captchaId = '';
      captchaAnswer.value = '';
      captchaImage.removeAttribute('src');
    }
  }
  identifier.addEventListener('input', showAdminCaptchaOnTyping);
  function jsonRequest(url, body) {
    return fetch(url, {
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body || {})
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) { return { ok:res.ok,status:res.status,data:data }; });
    });
  }

  function startCodeCountdown(seconds) {
    var left = Math.max(1, Number(seconds) || 60);
    sendEmailCode.disabled = true;
    function tick() {
      sendEmailCode.textContent = left > 0 ? left + ' 秒后重发' : '重新发送';
      if (left <= 0) {
        clearInterval(codeTimer); codeTimer = null; sendEmailCode.disabled = false; return;
      }
      left -= 1;
    }
    tick();
    codeTimer = setInterval(tick, 1000);
  }

  function sendCode() {
    var email = identifier.value.trim().toLowerCase();
    if (!email || email.indexOf('@') < 1) { message.textContent = '请先填写正确的邮箱地址。'; return; }
    sendEmailCode.disabled = true;
    sendEmailCode.textContent = '正在发送…';
    var request;
    if (mode === 'register') request = jsonRequest('/api/auth/email/send', { email:email, purpose:'register' });
    else if (mode === 'recovery') request = jsonRequest('/api/auth/recovery/send', { email:email });
    else if (mode === 'verify' && pendingPassword) request = jsonRequest('/api/auth/login', { email:email, password:pendingPassword, tenantId:selectedTenantId(), sendEmailCode:true });
    else { sendEmailCode.disabled = false; sendEmailCode.textContent = '获取验证码'; return; }
    request.then(function (result) {
      if (!result.ok && result.status !== 202) {
        message.textContent = result.data.message || result.data.error || '验证码发送失败，请稍后重试。';
        sendEmailCode.disabled = false; sendEmailCode.textContent = '获取验证码'; return;
      }
      if (mode === 'verify' && result.status === 200) {
        completeLogin(result.data, email);
        return;
      }
      if (mode === 'verify' && result.data.codeSent !== true) {
        message.textContent = result.data.message || '当前需要邮箱验证，请点击“获取验证码”后继续。';
        sendEmailCode.disabled = false;
        sendEmailCode.textContent = '获取验证码';
        return;
      }
      message.textContent = '验证码已发送至 ' + (result.data.emailMask || '绑定邮箱') + '，请检查邮箱。';
      startCodeCountdown(result.data.retryAfterSeconds || 60);
    }).catch(function () {
      message.textContent = '无法连接服务器。';
      sendEmailCode.disabled = false; sendEmailCode.textContent = '获取验证码';
    });
  }

  function completeLogin(data, email) {
    try {
      localStorage.removeItem('erp_auth_token');
      localStorage.setItem('erp_auth_username', data.username || '');
      if (email) localStorage.setItem('erp_auth_email', email);
      if (data.passwordResetRecommended) localStorage.setItem('wyerp_password_reset_recommended', '1');
      sessionStorage.removeItem('wyerp_workspace_tabs_v1');
    } catch (e) {}
    location.replace('/workspace.html?open=%2Findex.html');
  }

  fetch('/api/auth/me', { credentials: 'same-origin' }).then(function (res) { if (res.ok) location.replace(safeNext()); }).catch(function () {});
  refreshCaptcha.addEventListener('click', loadCaptcha);
  captchaImage.addEventListener('click', loadCaptcha);
  sendEmailCode.addEventListener('click', sendCode);
  switchMode.addEventListener('click', function () { pendingPassword=''; setMode(mode === 'register' ? 'login' : 'register'); });
  forgotPassword.addEventListener('click', function () { pendingPassword=''; setMode(mode === 'recovery' ? 'login' : 'recovery'); });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var email = identifier.value.trim().toLowerCase();
    var secret = password.value;
    var code = emailCode.value.replace(/\D/g, '');
    var request;

    if (!email) { message.textContent = '请输入邮箱。'; return; }
    if (mode === 'login') {
      if (!secret) { message.textContent = '请输入密码。'; return; }
      var body = { email:email, password:secret, tenantId:selectedTenantId() };
      if (isAdminIdentifier()) {
        body = { username:'admin', password:secret, captchaId:captchaId, captchaAnswer:captchaAnswer.value.trim() };
      }
      pendingPassword = secret;
      request = jsonRequest('/api/auth/login', body);
    } else if (mode === 'register') {
      if (secret.length < 6) { message.textContent = '密码至少需要 6 位。'; return; }
      if (!/^\d{6}$/.test(code)) { message.textContent = '请输入邮件中的 6 位验证码。'; return; }
      var referral = String(inviteCode.value || '').trim().toUpperCase();
      if (referral && !/^WY[A-F0-9]{10}$/.test(referral)) { message.textContent = '邀请码格式不正确，请核对后重试；也可以清空邀请码继续注册。'; return; }
      request = jsonRequest('/api/auth/register', { email:email, password:secret, emailCode:code, inviteCode:referral });
    } else if (mode === 'verify') {
      if (!/^\d{6}$/.test(code)) { message.textContent = '请输入邮件中的 6 位验证码。'; return; }
      request = jsonRequest('/api/auth/login/verify', { email:email, emailCode:code, tenantId:selectedTenantId() });
    } else {
      if (!/^\d{6}$/.test(code)) { message.textContent = '请输入邮件中的 6 位验证码。'; return; }
      request = jsonRequest('/api/auth/recovery/login', { email:email, emailCode:code, tenantId:selectedTenantId() });
    }

    submit.disabled = true;
    message.textContent = '';
    request.then(function (result) {
      submit.disabled = false;
      if (result.status === 300 && result.data.requiresTenantSelection) {
        showTenantChoices(result.data.tenants || []);
        message.textContent = '这个邮箱关联了多个企业，请选择要进入的企业后继续。';
        return;
      }
      if (mode === 'login' && result.status === 202 && result.data.requiresEmailCode) {
        var reason = result.data.reason === 'first_login' ? '首次登录需要验证邮箱，请点击“获取验证码”后完成验证。'
          : result.data.reason === 'new_device' ? '检测到新设备，需要验证邮箱，请点击“获取验证码”后完成验证。'
          : result.data.reason === 'security_risk' ? '检测到登录安全风险，需要验证邮箱后继续。请点击“获取验证码”。'
          : '账号存在自动安全异常，需要验证邮箱后继续；验证通过后将解除自动异常状态。请点击“获取验证码”。';
        setMode('verify', { message:result.data.message || reason });
        return;
      }
      if (!result.ok) {
        message.textContent = result.data.message || result.data.error || (result.status === 429 ? '尝试次数过多，请稍后再试。' : '请求失败，请稍后重试。');
        if (mode === 'login') {
          setHidden(captchaWrap, false);
          loadCaptcha();
        }
        return;
      }
      completeLogin(result.data, email.indexOf('@') > 0 ? email : '');
    }).catch(function () {
      submit.disabled = false;
      message.textContent = '无法连接服务器。';
    });
  });

  var initialInvite = String(new URLSearchParams(location.search).get('invite') || '').trim().toUpperCase();
  if (/^WY[A-F0-9]{10}$/.test(initialInvite)) {
    inviteCode.value = initialInvite;
    setMode('register', { message:'邀请码已填写，完成邮箱验证注册后可额外获得邀请奖励。' });
  } else setMode('login');
})();
</script>
</body>
</html>
