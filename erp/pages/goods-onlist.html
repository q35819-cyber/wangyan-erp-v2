<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>上架记录 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css">
<style>
  .record-table{min-width:980px}.product-cell{display:flex;gap:10px;align-items:center;min-width:0}.product-cell>div:last-child{min-width:0;flex:1}.product-img{width:48px;height:48px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.product-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.sku{margin-top:4px;color:var(--muted);font-size:11px}.empty{padding:72px 20px;text-align:center;color:var(--text-faint);line-height:1.8}.record-footer{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body>
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div>
<div class="main-content"><div class="header"><div class="header-left"><strong>上架记录</strong><span class="breadcrumb">网研ERP <span>/</span> 商品 <span>/</span> 上架记录</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div>
<main class="content ui-page">
  <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)"><div class="stat-card"><h4>今日提交</h4><div class="value" id="todayCount">0</div><div class="trend">仅统计新增商品提交</div></div><div class="stat-card"><h4>本月提交</h4><div class="value" id="monthCount">0</div><div class="trend">不包含同步或商品编辑</div></div><div class="stat-card"><h4>新增成功</h4><div class="value" id="successCount">0</div><div class="trend">Ozon已确认创建成功</div></div><div class="stat-card"><h4>待处理/失败</h4><div class="value" id="pendingCount">0</div><div class="trend">新增提交任务当前状态</div></div></div>

  <div class="filter-bar"><input class="input" id="keyword" placeholder="搜索商品名称 / SKU"><select class="select" id="shop"><option value="">全部店铺</option></select><select class="select" id="category"><option value="">全部类目</option></select><select class="select" id="status"><option value="">全部状态</option></select><button class="btn btn-primary" id="searchBtn">搜索</button><div class="membership-quota-inline" id="dailySkuMembershipQuota"></div></div>
  <section class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table class="record-table"><thead><tr><th>商品</th><th>店铺</th><th>类目</th><th>上架时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="recordBody"></tbody></table></div><div class="record-footer"><span id="totalText">共 0 条记录</span><span>服务端每30秒确认 Ozon；未确认时显示提交时间，成功后改为平台真实上架时间</span></div></section>
</main></div>
<script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/membership-quota.js?v=20261005-quota01"></script><script src="../assets/product-records.js"></script><script src="../assets/sku-mask.js"></script><script src="../assets/ozon-product-link.js?v=20261005-ozonlink01"></script><script src="../assets/navigation-ref.js"></script><script src="../assets/sidebar.js"></script>
<script>
(function(){'use strict';var model=window.WYERP_PRODUCT_RECORDS,quotaApi=window.WYERP_MEMBERSHIP_QUOTA,rows=[],pollTimer=null,loading=false;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function options(id,label,values){var s=document.getElementById(id),current=s.value;s.innerHTML='<option value="">'+label+'</option>'+values.filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;}).map(function(v){return '<option>'+esc(v)+'</option>';}).join('');if(values.indexOf(current)>=0)s.value=current;}
function badge(status){return /失败/i.test(status)?'badge-red':/已提交|校验|提交中|处理中|确认中|待核对/i.test(status)?'badge-yellow':/新增成功/i.test(status)?'badge-green':'badge-gray';}
function render(){var list=model.sort(model.filter(rows,{keyword:document.getElementById('keyword').value,shop:document.getElementById('shop').value,category:document.getElementById('category').value,status:document.getElementById('status').value})),body=document.getElementById('recordBody');document.getElementById('totalText').textContent='共 '+list.length+' 条记录';if(!list.length){body.innerHTML='<tr><td colspan="6"><div class="empty">暂无符合条件的上架记录<br>只有在「新增商品」页面提交后，这里才会产生记录。</div></td></tr>';return;}body.innerHTML=list.map(function(p){var img=p.image?'<img class="product-img" src="'+esc(p.image)+'" alt="">':'<div class="product-img"></div>',idLine='货号：'+esc(p.offerId||'--')+(p.productId?' · Ozon ID：'+esc(p.productId):'')+(p.sku?' · SKU：'+esc(window.WYERP_SKU_MASK.mask(p.sku)):'');var action=/新增成功/.test(p.status)&&p.productId?'<a class="link" href="'+esc(window.WYERP_NAV_REF.href('goods-online.html',{kind:'online-product-filter',productId:String(p.productId||'')}))+'">查看在线商品</a>':'<span class="breadcrumb">'+(/平台确认中/.test(p.status)?'正在确认平台商品':'等待新增结果')+'</span>';return '<tr><td><div class="product-cell">'+img+'<div>'+window.WYERP_OZON_PRODUCT_LINK.titleHtml(p,p.name||'未命名商品',{className:'product-name product-title-ellipsis ozon-product-title-link'})+'<div class="sku">'+idLine+'</div></div></div></td><td>'+esc(p.shop||'--')+'</td><td>'+esc(p.category||'--')+'</td><td>'+esc(p.publishedAt||p.submittedAt||p.createdAt||'--')+'</td><td><span class="badge '+badge(p.status)+'" title="'+esc(p.message||'')+'">'+esc(p.status||'--')+'</span></td><td>'+action+'</td></tr>';}).join('');}
function applyRows(items){rows=model.all(items||[]);var stats=model.listingStats(rows);document.getElementById('todayCount').textContent=stats.today;document.getElementById('monthCount').textContent=stats.month;document.getElementById('successCount').textContent=stats.success;document.getElementById('pendingCount').textContent=stats.pending;options('shop','全部店铺',rows.map(function(p){return p.shop;}));options('category','全部类目',rows.map(function(p){return p.category;}));options('status','全部状态',rows.map(function(p){return p.status;}));render();}
function needsPolling(){return rows.some(function(p){return /已提交|校验中|提交中|Ozon处理中|平台确认中/.test(p.status);});}
function schedulePoll(){if(pollTimer)clearTimeout(pollTimer);pollTimer=null;if(needsPolling()&&document.visibilityState!=='hidden')pollTimer=setTimeout(loadRecords,30000);}
function refreshDailySkuQuota(){return quotaApi.load().then(function(payload){var day=payload&&payload.quotas&&payload.quotas.businessDate;quotaApi.renderFromPayload(document.getElementById('dailySkuMembershipQuota'),payload,'dailySku',{label:'今日上架 SKU 会员额度',note:day?'北京时间 '+day:'按北京时间自然日统计'});return payload;}).catch(function(){return null;});}
function loadRecords(){if(loading)return;loading=true;return erpStorage.request('/api/domain/queries/product-listing-records').then(function(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.message||'上架记录读取失败');applyRows(data.items||[]);});}).then(refreshDailySkuQuota).catch(function(error){if(!rows.length)document.getElementById('recordBody').innerHTML='<tr><td colspan="6"><div class="empty">'+esc(error.message||'上架记录读取失败')+'</div></td></tr>';}).finally(function(){loading=false;schedulePoll();});}
erpStorage.init([]).then(loadRecords);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')loadRecords();else if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}});document.getElementById('searchBtn').addEventListener('click',render);document.getElementById('keyword').addEventListener('keydown',function(e){if(e.key==='Enter')render();});
})();</script></body></html>
