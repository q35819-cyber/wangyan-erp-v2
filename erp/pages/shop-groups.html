<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺分组 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>
.grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px}.group{padding:18px}.group h3{font-size:15px;margin-bottom:6px}.desc{min-height:38px;color:var(--muted);font-size:12px;line-height:1.6}.shops{margin:12px 0;display:flex;gap:6px;flex-wrap:wrap}.empty{grid-column:1/-1;padding:80px;text-align:center;color:var(--muted)}dialog{width:min(620px,calc(100vw - 30px));padding:0;border:0;border-radius:10px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0f172a66}.dh,.df{display:flex;padding:16px 20px}.dh{justify-content:space-between;border-bottom:1px solid var(--line)}.df{justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.db{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.full{grid-column:1/-1}.field .input{width:100%}.shop-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:220px;overflow:auto}.shop-option{padding:9px;border:1px solid var(--line);border-radius:6px}@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body><div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>店铺分组</strong><span class="breadcrumb">网研ERP <span>/</span> 店铺 <span>/</span> 店铺分组</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page"><div class="filter-bar"><input class="input" id="keyword" placeholder="搜索分组 / 负责人"><button class="btn" id="searchBtn">搜索</button><span class="spacer"></span><button class="btn btn-primary" id="newBtn">＋ 新建分组</button></div><div class="grid" id="grid"></div></main></div><dialog id="dialog" class="ui-page"><form id="form"><div class="dh"><b id="dialogTitle">新建分组</b><button type="button" class="icon-btn" id="closeBtn">×</button></div><div class="db"><input type="hidden" id="groupId"><label class="field">分组名称<input class="input" id="name" maxlength="80" required></label><label class="field">负责人<input class="input" id="manager" maxlength="80"></label><label class="field full">说明<textarea class="input" id="description" maxlength="300" rows="3"></textarea></label><div class="field full"><span>店铺</span><div class="shop-list" id="shopList"></div></div></div><div class="df"><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn btn-primary">保存</button></div></form></dialog><script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/shop-groups.js"></script><script src="../assets/sku-mask.js"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var model=window.WYERP_SHOP_GROUPS,skuMask=window.WYERP_SKU_MASK,groups=[],shops=[];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function shopKey(s){return String(s.clientId||s.externalShopId||s.name||'');}function shopDisplayName(s){var name=String(s&&s.name||'').trim();if(name)return name;var id=String(s&&(s.clientId||s.externalShopId)||'').trim();return id?skuMask.maskShopId(id):'未命名店铺';}function shopById(id){return shops.find(function(s){return shopKey(s)===String(id);});}function save(){return erpStorage.set('erp_shop_groups',groups);}function render(){var q=keyword.value.trim().toLowerCase(),rows=groups.filter(function(v){return!q||(v.name+' '+v.manager).toLowerCase().includes(q);});grid.innerHTML=rows.length?rows.map(function(v){var tags=v.shopIds.map(shopById).filter(Boolean).map(function(s){return'<span class="badge badge-blue">'+esc(shopDisplayName(s))+'</span>';}).join('');return'<article class="card group"><h3>'+esc(v.name)+'</h3><div class="desc">'+esc(v.description||'暂无说明')+'</div><div class="shops">'+(tags||'<span class="badge badge-gray">未分配店铺</span>')+'</div><div class="desc">负责人：'+esc(v.manager||'--')+' · '+v.shopIds.length+' 个店铺</div><div style="margin-top:12px"><button class="btn edit" data-id="'+esc(v.id)+'">编辑</button> <button class="btn delete" data-id="'+esc(v.id)+'">删除</button></div></article>';}).join(''):'<div class="empty">暂无店铺分组，请新建分组并选择真实店铺。</div>';}function open(v){groupId.value=v?v.id:'';document.getElementById('name').value=v?v.name:'';manager.value=v?v.manager:'';description.value=v?v.description:'';var selected=v?v.shopIds:[];shopList.innerHTML=shops.length?shops.map(function(s){var id=shopKey(s);return'<label class="shop-option"><input type="checkbox" value="'+esc(id)+'" '+(selected.indexOf(id)>=0?'checked':'')+'> '+esc(shopDisplayName(s))+'</label>';}).join(''):'<div class="desc">尚未添加店铺。</div>';dialogTitle.textContent=v?'编辑分组':'新建分组';dialog.showModal();}searchBtn.onclick=render;keyword.onkeydown=function(e){if(e.key==='Enter')render();};newBtn.onclick=function(){open(null);};closeBtn.onclick=cancelBtn.onclick=function(){dialog.close();};grid.onclick=function(e){var b=e.target.closest('button');if(!b)return;var v=groups.find(function(x){return x.id===b.dataset.id;});if(b.classList.contains('edit'))open(v);if(b.classList.contains('delete')&&confirm('确定删除该分组？')){groups=model.remove(groups,v.id);save().then(render);}};form.onsubmit=function(e){e.preventDefault();var ids=Array.from(shopList.querySelectorAll('input:checked')).map(function(x){return x.value;}),item=model.normalize({id:groupId.value,name:document.getElementById('name').value,manager:manager.value,description:description.value,shopIds:ids});groups=model.upsert(groups,item);save().then(function(){dialog.close();render();});};erpStorage.init(['erp_shops_data','erp_shop_groups']).then(function(){shops=Array.isArray(erpStorage.get('erp_shops_data'))?erpStorage.get('erp_shops_data'):[];groups=model.normalizeAll(erpStorage.get('erp_shop_groups'));render();});})();
</script></body></html>
