  .ui-page .btn.category-match-btn:hover:not(:disabled) { border-color:var(--primary); background:linear-gradient(135deg,var(--primary),var(--primary)); color:#fff; box-shadow:0 6px 14px rgba(47,117,216,.22); }

  .ui-page .btn.package-supplement-btn { min-height:36px; padding:8px 14px; border-color:rgba(5,150,105,.28); background:linear-gradient(135deg,rgba(16,185,129,.09),rgba(45,212,191,.12)); color:#047857; font-weight:600; box-shadow:0 2px 7px rgba(5,150,105,.11); }
  .ui-page .btn.package-supplement-btn:hover:not(:disabled) { border-color:#059669; background:linear-gradient(135deg,#059669,#0D9488); color:#fff; box-shadow:0 6px 14px rgba(5,150,105,.20); }
  .ui-page .btn.package-supplement-btn:disabled { border-color:var(--line); background:var(--surface); color:var(--text-faint); box-shadow:none; opacity:.72; }
  body.theme-dark .ui-page .btn.package-supplement-btn { border-color:rgba(52,211,153,.34); background:linear-gradient(135deg,rgba(16,185,129,.13),rgba(45,212,191,.12)); color:#6EE7B7; box-shadow:0 2px 8px rgba(0,5,16,.30); }

  .ui-page .btn.collect-bulk-btn:hover { background:rgba(220,38,38,.06); color:var(--red); border-color:rgba(220,38,38,.36); }
  .ui-page .btn.collect-clear-btn { background:rgba(220,38,38,.08); color:var(--red); border-color:rgba(220,38,38,.22); }
  .ui-page .btn.collect-clear-btn:hover { background:rgba(220,38,38,.15); border-color:rgba(220,38,38,.46); }

  body.theme-dark .ui-page .btn.collect-bulk-btn:hover { background:rgba(248,113,113,.10); color:#FCA5A5; border-color:rgba(248,113,113,.38); }
  body.theme-dark .ui-page .btn.collect-clear-btn { background:rgba(248,113,113,.12); color:#FCA5A5; border-color:rgba(248,113,113,.30); }
  body.theme-dark .ui-page .btn.collect-clear-btn:hover { background:rgba(248,113,113,.20); border-color:rgba(248,113,113,.55); }
  .ui-page .btn.collect-action-btn { height:auto; min-height:30px; padding:4px 7px; font-size:12px; border:1px solid transparent; box-shadow:0 1px 2px rgba(15,23,42,.06); }
  .ui-page .btn.collect-create-btn { background:var(--primary-light); color:var(--primary); border-color:rgba(55,120,196,.18); }
  .ui-page .btn.collect-create-btn:hover { background:var(--primary-muted); border-color:var(--primary); }
  .ui-page .btn.collect-remove-btn { background:rgba(220,38,38,.07); color:var(--red); border-color:rgba(220,38,38,.18); }
  .ui-page .btn.collect-remove-btn:hover { background:rgba(220,38,38,.13); border-color:rgba(220,38,38,.42); }
  body.theme-dark .ui-page .btn.collect-create-btn { background:var(--primary-light); color:var(--primary); border-color:rgba(215,160,84,.35); }
  body.theme-dark .ui-page .btn.collect-create-btn:hover { background:rgba(215,160,84,.20); border-color:var(--primary); }

<body>
  <div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div>
  <div class="main-content">
    <div class="header">
      <div class="header-left"><strong>采集箱</strong><span class="breadcrumb">网研ERP <span>/</span> 商品 <span>/</span> 采集箱</span></div>
      <div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div>
    </div>
    <main class="content ui-page collect-page-layout">
      <div class="toolbar">
        <input class="input" id="keyword" placeholder="搜索产品标题">
        <select class="select" id="sourceFilter"><option value="">全部平台</option></select>
        <select class="select" id="statusFilter"><option value="">上架状态</option><option>未上架</option><option>已上架</option><option>上架失败</option></select>
        <button class="btn btn-primary" id="searchBtn">搜索</button>
        <span class="category-match-filter-shell"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m15.5 15.5 4.2 4.2"></path></svg><input class="input category-match-filter" id="categoryMatchFilter" type="search" placeholder="搜索OZON类目/匹配率" aria-label="模糊搜索OZON类目或自动匹配百分比"></span><div class="membership-quota-inline" id="collectionBoxMembershipQuota"></div>
        <span class="spacer"></span>
        <button class="btn package-supplement-btn" id="supplementDimensionBtn" type="button" title="只为重量大于0且低于500g、尺寸缺失的商品补充默认尺寸100&nbsp;×&nbsp;100&nbsp;×&nbsp;100&nbsp;mm；已有尺寸不覆盖，500g及以上或重量未知不处理。" aria-label="补充尺寸：仅处理重量低于500克且尺寸缺失的商品"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path><path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12.1V21"></path><path d="M8.5 5 16 9.3"></path></svg><span id="supplementDimensionBtnLabel">补充尺寸</span></button>
        <button class="btn category-match-btn" id="matchCategoryBtn" type="button" disabled title="综合参考商品标题、1688货源类目和商品属性，一键匹配采集箱全部商品的Ozon三级类目" aria-label="综合标题、货源类目和商品属性匹配全部Ozon类目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7H7a4 4 0 0 0 0 8h1.5M15.5 7H17a4 4 0 0 1 0 8h-1.5M9 12h6"></path><path d="m12 3 .55 1.45L14 5l-1.45.55L12 7l-.55-1.45L10 5l1.45-.55L12 3Z"></path></svg><span id="matchCategoryBtnLabel">匹配全部类目</span></button>
        <button class="btn btn-primary" id="createBtn">手动创建商品</button>
        <span class="category-match-status" id="categoryMatchStatus" role="status" aria-live="polite" hidden></span>
      </div>

      <div class="collect-quick-filters" id="collectionQuickFilters" aria-label="采集箱快捷筛选">
        <button class="collect-quick-filter on" type="button" data-quick-filter="all" aria-pressed="true">所有 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="unlisted" aria-pressed="false">未上架 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="drafts" aria-pressed="false">我的草稿 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="category_failed" aria-pressed="false">匹配失败（类目） <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="free_shipping" aria-pressed="false">包邮 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="one_piece" aria-pressed="false">一件起批 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="with_package" aria-pressed="false">有尺寸重量 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="without_package" aria-pressed="false">无尺寸重量 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="listed" aria-pressed="false">已上架 <strong>0</strong></button>
        <button class="collect-quick-filter" type="button" data-quick-filter="combination" aria-pressed="false">组合 <strong>0</strong></button>
        <span class="collect-quick-actions">
          <button class="btn collect-toolbar-action collect-bulk-btn" id="deleteBtn" type="button" title="删除当前勾选的商品" aria-label="批量删除当前勾选的商品"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4" height="4" rx="1"/><path d="m4 6 1 1 2-2M10 6h11M3 12h4m3 0h11M3 18h4m3 0h7"/></svg><span>批量删除</span></button>
          <button class="btn collect-toolbar-action collect-clear-btn" id="clearBtn" type="button" title="清空采集箱内全部商品" aria-label="清空采集箱内全部商品"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6m4-6v6"/></svg><span>清空采集箱</span></button>
        </span>
      </div>
      <section class="card collect-table-card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table class="collect-table">
            <thead><tr><th><input type="checkbox" id="selectAll" aria-label="全选"></th><th>图片</th><th class="title-column">产品名称</th><th class="category-column">来源类目</th><th class="category-column">OZON类目</th><th>采集价格</th><th>最低起批运费</th><th>SKU数量</th><th>采集来源</th><th class="package-column">重量和尺寸</th><th>采集人</th><th>上架状态</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead>
            <tbody id="collectBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <dialog class="ui-page" id="editor">
    <form id="editorForm">
      <div class="dialog-head"><h3 id="dialogTitle">手动创建商品</h3><button class="dialog-close" id="closeBtn" type="button" aria-label="关闭">×</button></div>
      <div class="dialog-body">
        <label class="dialog-field full">产品名称<input class="input" id="editTitle" required maxlength="200"></label>
        <label class="dialog-field">采集价格<input class="input" id="editPrice" inputmode="decimal" data-input-kind="decimal"></label>
        <label class="dialog-field">SKU数量<input class="input" id="editSkuCount" inputmode="numeric" data-input-kind="integer"></label>
        <label class="dialog-field">采集来源<input class="input" id="editSource" maxlength="50" placeholder="例如：1688"></label>
        <label class="dialog-field">上架状态<select class="select" id="editStatus"><option>未上架</option><option>已上架</option><option>上架失败</option></select></label>
        <label class="dialog-field full">图片地址<input class="input" id="editImage" type="url" maxlength="1000" placeholder="https://..."></label>
        <label class="dialog-field full">货源地址<input class="input" id="editSourceUrl" type="url" maxlength="1000" placeholder="https://detail.1688.com/..."></label>
        <label class="dialog-field full">备注<input class="input" id="editNote" maxlength="300"></label>
      </div>
      <div class="dialog-foot"><button class="btn" id="cancelBtn" type="button">取消</button><button class="btn btn-primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <dialog class="ui-page" id="categoryEditor">
    <form id="categoryForm">
      <div class="dialog-head"><h3>手动更改Ozon类目</h3><button class="dialog-close" id="categoryCloseBtn" type="button" aria-label="关闭">×</button></div>
      <div class="category-dialog-body">
        <div class="category-dialog-summary"><strong class="product-title-ellipsis" id="categoryProductTitle">--</strong><span>来源类目：<span id="categorySourcePath">--</span></span></div>
        <label class="dialog-field">搜索Ozon三级类目<input class="input" id="categorySearch" type="search" maxlength="120" placeholder="输入类目名称或路径，例如：香薰扩香器"></label>
        <span class="category-dialog-hint" id="categorySearchCount"></span>
        <label class="dialog-field">选择Ozon三级类目<select class="category-result-select" id="ozonCategorySelect" size="10" required></select></label>
        <p class="category-dialog-hint" id="categoryFeedbackHint"></p>
      </div>
      <div class="dialog-foot"><button class="btn" id="categoryCancelBtn" type="button">取消</button><button class="btn btn-primary" id="categorySaveBtn" type="submit">保存并学习</button></div>
    </form>
  </dialog>
  <dialog class="ui-page" id="combinationHistoryDialog">
    <div class="dialog-head"><h3 id="combinationHistoryTitle">组合记录</h3><button class="dialog-close" id="combinationHistoryClose" type="button" aria-label="关闭组合记录">×</button></div>
    <div class="dialog-body">
      <div class="combination-history-summary" id="combinationHistorySummary"></div>
      <div class="combination-history-list" id="combinationHistoryList"></div>
    </div>
    <div class="dialog-foot"><button class="btn" id="combinationHistoryDone" type="button">关闭</button></div>
  </dialog>
  <dialog class="ui-page" id="packageEditor">
    <form id="packageForm">
      <div class="dialog-head"><h3>修改重量和尺寸</h3><button class="dialog-close" id="packageCloseBtn" type="button" aria-label="关闭">×</button></div>
      <div class="dialog-body package-edit-body">
        <div class="package-edit-summary"><strong class="product-title-ellipsis" id="packageProductTitle">--</strong><span>仅修改包装重量和长、宽、高；空白项保持原值。</span></div>
        <section class="package-edit-section package-weight-section" aria-labelledby="packageWeightTitle">
          <div class="package-edit-section-title"><span id="packageWeightTitle">包装重量</span><small>单独填写一行</small></div>
          <div class="package-weight-grid">
            <label class="package-input-field"><span class="package-input-label">重量</span><span class="package-input-shell"><input class="package-input" id="packageWeight" inputmode="decimal" data-input-kind="decimal" maxlength="12" placeholder="例如：680"><span class="package-input-unit">g</span></span></label>
          </div>
        </section>
        <section class="package-edit-section package-dimension-section" aria-labelledby="packageDimensionTitle">
          <div class="package-edit-section-title"><span id="packageDimensionTitle">包装尺寸</span><small>长 × 宽 × 高</small></div>
          <div class="package-dimension-grid">
            <label class="package-input-field"><span class="package-input-label">长度</span><span class="package-input-shell"><input class="package-input" id="packageLength" inputmode="decimal" data-input-kind="decimal" maxlength="12" placeholder="例如：310"><span class="package-input-unit">mm</span></span></label>
            <label class="package-input-field"><span class="package-input-label">宽度</span><span class="package-input-shell"><input class="package-input" id="packageWidth" inputmode="decimal" data-input-kind="decimal" maxlength="12" placeholder="例如：220"><span class="package-input-unit">mm</span></span></label>
            <label class="package-input-field"><span class="package-input-label">高度</span><span class="package-input-shell"><input class="package-input" id="packageHeight" inputmode="decimal" data-input-kind="decimal" maxlength="12" placeholder="例如：95"><span class="package-input-unit">mm</span></span></label>
          </div>
        </section>
        <p class="package-edit-hint" id="packageEditHint">单位固定为克和毫米，填写值必须大于0。</p>
      </div>
      <div class="dialog-foot"><button class="btn" id="packageCancelBtn" type="button">取消</button><button class="btn btn-primary" id="packageSaveBtn" type="submit">保存重量和尺寸</button></div>
    </form>
  </dialog>
