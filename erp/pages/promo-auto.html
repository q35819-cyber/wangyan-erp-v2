<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动删促销 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>.notice{margin-bottom:14px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--red) 32%,var(--line));border-radius:6px;background:var(--ui-soft-danger);color:var(--red);font-size:12px}.rule-form{display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:10px;margin-bottom:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:8px}.empty{padding:70px;text-align:center;color:var(--text-faint)}.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:900px){.rule-form{grid-template-columns:1fr}}</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body>
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>自动删促销</strong><span class="breadcrumb">网研ERP <span>/</span> 促销 <span>/</span> 自动删促销</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page">
<div class="notice">规则执行器尚未接入 OZON。这里保存规则草稿，但不会自动删除任何促销，也不会展示虚假止损金额或执行次数。</div><div class="stats-grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat-card"><h4>规则总数</h4><div class="value" id="allStat">0</div><div class="trend">当前租户草稿</div></div><div class="stat-card"><h4>标记启用</h4><div class="value" id="onStat">0</div><div class="trend">执行器未接入</div></div><div class="stat-card"><h4>实际执行</h4><div class="value">0</div><div class="trend">尚无执行日志</div></div></div>
<form class="rule-form" id="form"><input class="input" id="name" required placeholder="规则名称"><input class="input" id="condition" required placeholder="触发条件说明"><input class="input" id="shops" placeholder="生效店铺，默认全部"><button class="btn btn-primary">新增规则</button></form><section class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>规则名称</th><th>触发条件</th><th>生效店铺</th><th>配置状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot" id="count">共 0 条规则</div></section></main></div>
<script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/promotion-data.js"></script><script src="../assets/table-pagination.js?v=20261002-b07b2"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var KEY='erp_promotion_rules',m=window.WYERP_PROMOTION_DATA,list=[];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function save(){erpStorage.set(KEY,list);render();}function render(){allStat.textContent=list.length;onStat.textContent=list.filter(function(v){return v.status==='启用';}).length;count.textContent='共 '+list.length+' 条规则';body.innerHTML=list.length?list.map(function(v){return'<tr><td><b>'+esc(v.name)+'</b></td><td>'+esc(v.condition)+'</td><td>'+esc(v.shops)+'</td><td><span class="badge '+(v.status==='启用'?'badge-yellow':'badge-gray')+'">'+esc(v.status)+'</span></td><td>'+esc(v.updatedAt||v.createdAt||'--')+'</td><td><button class="link toggle" data-id="'+esc(v.id)+'">'+(v.status==='启用'?'停用':'启用')+'</button> <button class="link danger del" data-id="'+esc(v.id)+'">删除</button></td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty">暂无规则草稿</div></td></tr>';}form.onsubmit=function(e){e.preventDefault();var now=new Date().toISOString();list=m.upsertRule(list,{id:crypto.randomUUID?crypto.randomUUID():'r-'+Date.now(),name:name.value,condition:condition.value,shops:shops.value||'全部店铺',status:'停用',createdAt:now,updatedAt:now});form.reset();save();};body.onclick=function(e){var b=e.target.closest('button');if(!b)return;var v=list.find(function(x){return x.id===b.dataset.id;});if(b.classList.contains('toggle')){v.status=v.status==='启用'?'停用':'启用';v.updatedAt=new Date().toISOString();list=m.upsertRule(list,v);save();}if(b.classList.contains('del')&&confirm('确定删除该规则草稿？')){list=m.removeRule(list,b.dataset.id);save();}};erpStorage.init([KEY]).then(function(){list=m.rules(erpStorage.get(KEY));render();});})();</script></body></html>
