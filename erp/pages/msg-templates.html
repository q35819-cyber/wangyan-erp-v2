<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息模板 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>
.empty{padding:70px;text-align:center;color:var(--text-faint)}.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}dialog{width:min(600px,calc(100vw - 30px));padding:0;border:0;border-radius:10px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0f172a66}.dh,.df{display:flex;align-items:center;padding:16px 20px}.dh{justify-content:space-between;border-bottom:1px solid var(--line)}.df{justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.db{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:20px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}.full{grid-column:1/-1}.field .input,.field .select{width:100%}.content-box{min-height:110px;padding:10px;border:1px solid var(--input-border);border-radius:6px;background:var(--input-bg);color:var(--text);resize:vertical}
</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body><div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>消息模板</strong><span class="breadcrumb">网研ERP <span>/</span> 消息 <span>/</span> 消息模板</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page">
<div class="stats-grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat-card"><h4>模板总数</h4><div class="value" id="totalStat">0</div><div class="trend">当前租户</div></div><div class="stat-card"><h4>已启用</h4><div class="value" id="enabledStat">0</div><div class="trend">可供消息流程调用</div></div><div class="stat-card"><h4>已停用</h4><div class="value" id="disabledStat">0</div><div class="trend">不会自动触发</div></div></div>
<div class="filter-bar"><input class="input" id="keyword" placeholder="搜索模板名称"><select class="select" id="type"><option value="">全部类型</option></select><select class="select" id="status"><option value="">全部状态</option><option>启用</option><option>停用</option></select><button class="btn btn-primary" id="searchBtn">搜索</button><span class="spacer"></span><button class="btn btn-primary" id="createBtn">＋ 新建模板</button></div>
<section class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>模板名称</th><th>类型</th><th>触发时机</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot" id="count">共 0 条记录</div></section></main></div>
<dialog id="editor" class="ui-page"><form id="form"><div class="dh"><b id="editorTitle">新建模板</b><button type="button" class="icon-btn" id="closeBtn">×</button></div><div class="db"><label class="field full">模板名称<input class="input" id="eName" required maxlength="120"></label><label class="field">类型<input class="input" id="eType" maxlength="50"></label><label class="field">状态<select class="select" id="eStatus"><option>启用</option><option>停用</option></select></label><label class="field full">触发时机<input class="input" id="eTrigger" maxlength="160"></label><label class="field full">模板内容<textarea class="content-box" id="eContent" required maxlength="5000"></textarea></label></div><div class="df"><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn btn-primary">保存</button></div></form></dialog>
<script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/message-data.js"></script><script src="../assets/table-pagination.js?v=20261002-b07b2"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var KEY='erp_message_templates',m=window.WYERP_MESSAGE_DATA,list=[],editing='';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function now(){return new Date().toISOString();}function id(){return crypto.randomUUID?crypto.randomUUID():'t-'+Date.now();}
function types(){var s=document.getElementById('type'),cur=s.value,vals=list.map(function(v){return v.type;}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});s.innerHTML='<option value="">全部类型</option>'+vals.map(function(v){return'<option>'+esc(v)+'</option>';}).join('');if(vals.indexOf(cur)>=0)s.value=cur;}
function render(){document.getElementById('totalStat').textContent=list.length;document.getElementById('enabledStat').textContent=list.filter(function(v){return v.status==='启用';}).length;document.getElementById('disabledStat').textContent=list.filter(function(v){return v.status==='停用';}).length;var rows=m.filterTemplates(list,{keyword:keyword.value,type:type.value,status:status.value});count.textContent='共 '+rows.length+' 条记录';body.innerHTML=rows.length?rows.map(function(v){return'<tr><td><b>'+esc(v.name)+'</b></td><td>'+esc(v.type||'--')+'</td><td>'+esc(v.trigger||'--')+'</td><td><span class="badge '+(v.status==='启用'?'badge-green':'badge-gray')+'">'+esc(v.status)+'</span></td><td>'+esc(v.updatedAt||v.createdAt||'--')+'</td><td><button class="link edit" data-id="'+esc(v.id)+'">编辑</button> <button class="link toggle" data-id="'+esc(v.id)+'">'+(v.status==='启用'?'停用':'启用')+'</button> <button class="link danger del" data-id="'+esc(v.id)+'">删除</button></td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty">暂无消息模板</div></td></tr>';}
function save(){erpStorage.set(KEY,list);types();render();}function open(v){v=v||{};editing=v.id||'';editorTitle.textContent=editing?'编辑模板':'新建模板';eName.value=v.name||'';eType.value=v.type||'';eStatus.value=v.status||'启用';eTrigger.value=v.trigger||'';eContent.value=v.content||'';editor.showModal();}
createBtn.onclick=function(){open();};closeBtn.onclick=cancelBtn.onclick=function(){editor.close();};searchBtn.onclick=render;body.onclick=function(e){var b=e.target.closest('button');if(!b)return;var v=list.find(function(x){return x.id===b.dataset.id;});if(b.classList.contains('edit'))open(v);if(b.classList.contains('toggle')){v.status=v.status==='启用'?'停用':'启用';v.updatedAt=now();list=m.upsertTemplate(list,v);save();}if(b.classList.contains('del')&&confirm('确定删除该模板？')){list=m.removeTemplate(list,b.dataset.id);save();}};form.onsubmit=function(e){e.preventDefault();var old=list.find(function(v){return v.id===editing;})||{};list=m.upsertTemplate(list,{id:editing||id(),name:eName.value,type:eType.value,trigger:eTrigger.value,content:eContent.value,status:eStatus.value,createdAt:old.createdAt||now(),updatedAt:now()});editor.close();save();};erpStorage.init([KEY]).then(function(){list=m.templates(erpStorage.get(KEY));types();render();});
})();</script></body></html>
