<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUG反馈 - 网研ERP</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.bug-layout{display:grid;grid-template-columns:minmax(330px,430px) minmax(560px,1fr);gap:16px;align-items:start}.bug-form-card,.bug-list-card{padding:0;overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:15px;margin:0 0 5px}.panel-head p{margin:0;color:var(--text-muted);font-size:12px;line-height:1.6}.bug-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}.field{display:flex;flex-direction:column;gap:7px;color:var(--text-muted);font-size:12px}.field.full{grid-column:1/-1}.field .input,.field .select{width:100%!important;max-width:none!important}.field input.input.search-input.form-search-input{width:100%!important;max-width:100%!important}.field textarea.input{min-height:96px;resize:vertical;line-height:1.6;padding:10px 12px}.field-note{color:var(--text-faint);font-size:11px}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;padding-top:2px}.bug-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.bug-toolbar .search-input{flex:0 0 var(--search-field-width)}.bug-list{padding:0 16px}.bug-item{padding:16px 2px;border-bottom:1px solid var(--line)}.bug-item:last-child{border-bottom:0}.bug-title-row{display:flex;align-items:center;gap:8px;min-width:0}.bug-title{font-size:14px;font-weight:650;color:var(--text);min-width:0;flex:1}.bug-id{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}.bug-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.bug-text{color:var(--text-muted);font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.bug-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;color:var(--text-faint);font-size:11px}.bug-empty{padding:76px 20px;text-align:center;color:var(--text-faint);font-size:13px}.severity-high{color:#c83e50;background:color-mix(in srgb,#c83e50 9%,var(--card));border-color:color-mix(in srgb,#c83e50 35%,var(--line))}.severity-medium{color:#c77a19;background:color-mix(in srgb,#c77a19 9%,var(--card));border-color:color-mix(in srgb,#c77a19 35%,var(--line))}.severity-low{color:#3c8a63;background:color-mix(in srgb,#3c8a63 9%,var(--card));border-color:color-mix(in srgb,#3c8a63 35%,var(--line))}.summary-strip{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:12px;margin-bottom:16px}.summary-item{padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.summary-item span{font-size:11px;color:var(--text-muted)}.summary-item strong{display:block;margin-top:4px;font-size:21px;color:var(--text)}.upload-box{padding:12px;border:1px dashed var(--input-border);border-radius:12px;background:var(--input-bg);transition:border-color .18s,background .18s,box-shadow .18s}.upload-box:hover,.upload-box.dragging,.upload-box:focus-within{border-color:var(--input-focus);background:color-mix(in srgb,var(--input-bg) 92%,var(--primary));box-shadow:0 0 0 3px color-mix(in srgb,var(--input-focus) 12%,transparent)}.upload-trigger{min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;border-radius:9px;cursor:pointer;user-select:none}.upload-trigger:active .upload-icon{transform:scale(.94)}.upload-icon{width:52px;height:52px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--input-focus) 35%,var(--line));border-radius:16px;color:var(--input-focus);background:color-mix(in srgb,var(--primary-light) 74%,var(--card));box-shadow:0 8px 22px color-mix(in srgb,var(--input-focus) 12%,transparent);transition:transform .16s,box-shadow .16s}.upload-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.upload-trigger:hover .upload-icon{transform:translateY(-2px);box-shadow:0 12px 28px color-mix(in srgb,var(--input-focus) 19%,transparent)}.upload-title{font-size:13px;font-weight:650;color:var(--text)}.upload-hint,.upload-limit{color:var(--text-faint);font-size:11px}.upload-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.selected-files{display:grid;gap:7px;margin-top:10px}.selected-file{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}.selected-file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:12px}.selected-file-size{color:var(--text-faint);font-size:11px;white-space:nowrap}.remove-file{border:0;background:transparent;color:var(--red);cursor:pointer;font-size:16px}.upload-status{min-height:18px;margin-top:8px;color:var(--text-muted);font-size:11px;text-align:center}.upload-status.error{color:var(--red)}.bug-attachments{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bug-attachment{display:flex;align-items:center;justify-content:center;width:112px;height:76px;border:1px solid var(--line);border-radius:8px;background:var(--surface-hover);overflow:hidden;color:var(--text-muted);font-size:11px;text-decoration:none}.bug-attachment img,.bug-attachment video{width:100%;height:100%;object-fit:cover}.bug-attachment.video{width:180px;height:102px}
@media(max-width:1100px){.bug-layout{grid-template-columns:1fr}.bug-form-card{max-width:none}}@media(max-width:650px){.bug-form{grid-template-columns:1fr}.field.full,.form-actions{grid-column:auto}.summary-strip{grid-template-columns:1fr 1fr 1fr}}
</style>
<link rel="stylesheet" href="../assets/ui.css">
<script src="../assets/theme-restore.js"></script>
</head>
<body>
<aside class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></aside>
<div class="main-content">
  <header class="header"><div class="header-left"><strong>BUG反馈</strong><span class="breadcrumb">网研ERP <span>/</span> 工具 <span>/</span> BUG反馈</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn" type="button">🔔</button><span class="avatar">管</span></div></header>
  <main class="content ui-page">
    <section class="summary-strip"><div class="summary-item"><span>反馈总数</span><strong id="totalCount">0</strong></div><div class="summary-item"><span>高优先级</span><strong id="highCount">0</strong></div><div class="summary-item"><span>本账号提交</span><strong id="mineCount">0</strong></div></section>
    <div class="bug-layout">
      <section class="card bug-form-card">
        <div class="panel-head"><h2>提交问题</h2><p>请描述实际现象和复现步骤，系统会自动记录提交用户、时间与浏览器信息。</p></div>
        <form class="bug-form" id="bugForm">
          <label class="field full">问题标题<input class="input search-input form-search-input" id="bugTitle" maxlength="120" placeholder="用一句话说明问题" required></label>
          <label class="field">所属模块<select class="select" id="bugModule"><option>订单管理</option><option>在线商品</option><option>大盘总览</option><option>店铺管理</option><option>任务中心</option><option>账号与权限</option><option>其他</option></select></label>
          <label class="field">严重程度<select class="select" id="bugSeverity"><option value="medium">一般</option><option value="high">严重</option><option value="low">轻微</option></select></label>
          <label class="field full">问题页面<input class="input search-input form-search-input" id="bugPage" maxlength="240" placeholder="例如：/pages/orders.html"><span class="field-note">从其他页面进入时会自动填写来源地址。</span></label>
          <label class="field full">实际问题<textarea class="input" id="bugDescription" maxlength="2000" placeholder="说明发生了什么、出现了什么错误" required></textarea></label>
          <label class="field full">复现步骤<textarea class="input" id="bugSteps" maxlength="2000" placeholder="例如：1. 打开订单管理；2. 点击同步订单；3. 页面一直停在 2%"></textarea></label>
          <label class="field full">期望结果<textarea class="input" id="bugExpected" maxlength="1000" placeholder="说明你希望系统正确表现为什么"></textarea></label>
          <div class="field full"><span>图片或视频</span><div class="upload-box" id="uploadBox"><label class="upload-trigger" for="bugFiles"><span class="upload-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span><strong class="upload-title">上传图片或视频</strong><span class="upload-hint">点击选择文件，也可以拖放到这里</span><span class="upload-limit">最多 6 个；图片 10MB，视频 100MB</span></label><input class="upload-input" id="bugFiles" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime" multiple><div class="selected-files" id="selectedFiles"></div><div class="upload-status" id="uploadStatus"></div></div></div>
          <div class="form-actions"><button class="btn" type="reset">清空</button><button class="btn btn-primary" id="submitBtn" type="submit">提交BUG</button></div>
        </form>
      </section>
      <section class="card bug-list-card">
        <div class="panel-head"><h2>反馈记录</h2><p>记录保存在当前租户的服务器数据中，方便主账号和协作人员统一追踪。</p></div>
        <div class="bug-toolbar"><input class="input search-input" id="keyword" placeholder="搜索标题、模块、内容或用户"><select class="select" id="severityFilter"><option value="">全部程度</option><option value="high">严重</option><option value="medium">一般</option><option value="low">轻微</option></select></div>
        <div class="bug-list" id="bugList"></div>
      </section>
    </div>
  </main>
</div>
<script src="../assets/brand.js"></script>
<script src="../assets/identity-display.js?v=20261006-id02"></script>
<script src="../assets/storage.js"></script>
<script src="../assets/bug-feedback.js"></script>
<script src="../assets/sidebar.js"></script>
</body>
</html>
