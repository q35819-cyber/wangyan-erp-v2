<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发送记录 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>.empty{padding:72px;text-align:center;color:var(--text-faint);line-height:1.8}.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body>
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>发送记录</strong><span class="breadcrumb">网研ERP <span>/</span> 消息 <span>/</span> 发送记录</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page">
<div class="stats-grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat-card"><h4>发送总数</h4><div class="value" id="allStat">0</div><div class="trend">实际日志</div></div><div class="stat-card"><h4>发送成功</h4><div class="value" id="okStat">0</div><div class="trend">由发送接口写入</div></div><div class="stat-card"><h4>失败待处理</h4><div class="value" id="failStat">0</div><div class="trend">不自动伪造重发</div></div></div>
<div class="filter-bar"><input class="input" id="keyword" placeholder="搜索模板 / 买家"><select class="select" id="channel"><option value="">全部渠道</option></select><select class="select" id="status"><option value="">全部状态</option></select><button class="btn btn-primary" id="searchBtn">搜索</button></div>
<section class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>发送时间</th><th>模板</th><th>买家</th><th>渠道</th><th>状态</th><th>失败原因</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot" id="count">共 0 条记录</div></section></main></div>
<script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/message-data.js"></script><script src="../assets/table-pagination.js?v=20261002-b07b2"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var KEY='erp_message_sendlog',m=window.WYERP_MESSAGE_DATA,list=[];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function opts(id,label,vals){var s=document.getElementById(id);vals=vals.filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});s.innerHTML='<option value="">'+label+'</option>'+vals.map(function(v){return'<option>'+esc(v)+'</option>';}).join('');}
function render(){allStat.textContent=list.length;okStat.textContent=list.filter(function(v){return v.status==='成功';}).length;failStat.textContent=list.filter(function(v){return v.status==='失败';}).length;var rows=m.filterLogs(list,{keyword:keyword.value,channel:channel.value,status:status.value});count.textContent='共 '+rows.length+' 条记录';body.innerHTML=rows.length?rows.map(function(v){return'<tr><td>'+esc(v.sentAt||'--')+'</td><td>'+esc(v.template||'--')+'</td><td>'+esc(v.buyer||'--')+'</td><td>'+esc(v.channel||'--')+'</td><td><span class="badge '+(v.status==='成功'?'badge-green':'badge-red')+'">'+esc(v.status||'--')+'</span></td><td>'+esc(v.error||'--')+'</td></tr>';}).join(''):'<tr><td colspan="6"><div class="empty">暂无真实发送记录<br>消息发送接口接入后会在此写入结果。</div></td></tr>';}searchBtn.onclick=render;erpStorage.init([KEY]).then(function(){list=m.logs(erpStorage.get(KEY));opts('channel','全部渠道',list.map(function(v){return v.channel;}));opts('status','全部状态',list.map(function(v){return v.status;}));render();});
})();</script></body></html>
