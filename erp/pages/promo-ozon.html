<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OZON促销活动 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>.empty{padding:75px;text-align:center;color:var(--text-faint);line-height:1.8}.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.notice{margin-bottom:14px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--yellow) 45%,var(--line));border-radius:6px;background:var(--ui-soft-warn);color:var(--ui-on-warn);font-size:12px}.product{min-width:250px;white-space:normal}.promo-product-title{font-weight:700}.old{text-decoration:line-through;color:var(--muted)}.promo{color:var(--red);font-weight:700}</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body>
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>OZON促销活动</strong><span class="breadcrumb">网研ERP <span>/</span> 促销 <span>/</span> OZON促销活动</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page">
<div class="notice">当前展示在线商品中已同步或手动保存的促销价。OZON 官方活动列表接口尚未接入，不显示虚构活动名称、订单数和销售额。</div><div class="stats-grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat-card"><h4>促销商品</h4><div class="value" id="productStat">0</div><div class="trend">真实促销价格记录</div></div><div class="stat-card"><h4>涉及店铺</h4><div class="value" id="shopStat">0</div><div class="trend">按商品店铺去重</div></div><div class="stat-card"><h4>有原价可比</h4><div class="value" id="priceStat">0</div><div class="trend">可计算优惠幅度</div></div></div>
<div class="filter-bar"><input class="input" id="keyword" placeholder="搜索商品名称 / SKU"><select class="select" id="shop"><option value="">全部店铺</option></select><button class="btn btn-primary" id="searchBtn">搜索</button></div><section class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>商品</th><th>SKU</th><th>店铺</th><th>原价</th><th>当前售价</th><th>促销价</th><th>优惠幅度</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot" id="count">共 0 条记录</div></section></main></div>
<script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/promotion-data.js"></script><script src="../assets/sku-mask.js"></script><script src="../assets/ozon-product-link.js?v=20261005-ozonlink01"></script><script src="../assets/navigation-ref.js"></script><script src="../assets/table-pagination.js?v=20261002-b07b2"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var m=window.WYERP_PROMOTION_DATA,list=[];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function render(){var q=keyword.value.toLowerCase(),s=shop.value,rows=list.filter(function(v){return(!q||(v.name+' '+v.sku).toLowerCase().indexOf(q)>=0)&&(!s||v.shop===s);});count.textContent='共 '+rows.length+' 条记录';body.innerHTML=rows.length?rows.map(function(v){var base=v.originalPrice||v.price,discount=base&&v.promoPrice!=null?Math.max(0,(1-v.promoPrice/base)*100):null;return'<tr><td class="product">'+window.WYERP_OZON_PRODUCT_LINK.titleHtml(v,v.name||'未命名商品',{className:'promo-product-title product-title-ellipsis ozon-product-title-link'})+'</td><td>'+esc(window.WYERP_SKU_MASK.mask(v.sku))+'</td><td>'+esc(v.shop||'--')+'</td><td class="old">'+(v.originalPrice==null?'--':'₽ '+v.originalPrice)+'</td><td>'+(v.price==null?'--':'₽ '+v.price)+'</td><td class="promo">₽ '+v.promoPrice+'</td><td>'+(discount==null?'--':discount.toFixed(1)+'%')+'</td><td>'+esc(v.updatedAt||'--')+'</td><td><a class="link" href="'+esc(window.WYERP_NAV_REF.href('goods-online.html',{kind:'online-product-filter',sku:String(v.sku||'')}))+'">查看商品</a></td></tr>';}).join(''):'<tr><td colspan="9"><div class="empty">暂无真实促销商品数据<br>可在在线商品同步或维护促销价。</div></td></tr>';}searchBtn.onclick=render;erpStorage.init(['erp_online_products']).then(function(){list=m.products(erpStorage.get('erp_online_products'));productStat.textContent=list.length;shopStat.textContent=list.map(function(v){return v.shop;}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;}).length;priceStat.textContent=list.filter(function(v){return v.originalPrice!=null||v.price!=null;}).length;var shops=list.map(function(v){return v.shop;}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});shop.innerHTML='<option value="">全部店铺</option>'+shops.map(function(v){return'<option>'+esc(v)+'</option>';}).join('');render();});})();</script></body></html>
