<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 助手 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>
.shell{max-width:900px;margin:0 auto}.status{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:14px}.dot{width:10px;height:10px;border-radius:50%;background:#f59e0b}.dot.ok{background:#16a34a}.chat{height:calc(100vh - 260px);min-height:430px;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}.messages{flex:1;padding:20px;overflow:auto;background:var(--surface-hover)}.message{max-width:78%;padding:12px 15px;border-radius:10px;line-height:1.7;font-size:13px;background:var(--card);border:1px solid var(--line)}.message.me{margin:12px 0 12px auto;background:var(--primary);color:#fff;border-color:var(--primary)}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}.composer .input{flex:1}.hint{margin-top:8px;color:var(--muted);font-size:12px}
</style><script src="../assets/theme-restore.js"></script></head><body><div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>AI 助手</strong><span class="breadcrumb">网研ERP <span>/</span> 工具 <span>/</span> AI 助手</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content"><div class="shell"><div class="status"><span class="dot" id="dot"></span><div><b id="statusTitle">正在检查 AI 服务…</b><div class="hint" id="statusMessage">页面不会向浏览器索要 API 密钥。</div></div></div><section class="chat"><div class="messages" id="messages"><div class="message">当前页面只显示真实集成状态。服务端 AI 对话接口尚未接通，因此不会生成模拟回答。</div></div><form class="composer" id="form"><input class="input" id="question" maxlength="4000" placeholder="AI 对话服务接通后可在此提问" disabled><button class="btn btn-primary" id="send" disabled>发送</button></form></section></div></main></div><script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}form.onsubmit=function(e){e.preventDefault();};erpStorage.init([]).then(function(){return fetch('/api/integrations/ai/status',{credentials:'same-origin'});}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;});}).then(function(state){var ready=state.configured&&state.chatImplemented;dot.classList.toggle('ok',ready);statusTitle.textContent=ready?'AI 服务已就绪':'AI 对话尚未接通';statusMessage.textContent=state.message||'暂无状态说明';question.disabled=!ready;send.disabled=!ready;}).catch(function(err){statusTitle.textContent='无法读取 AI 状态';statusMessage.textContent=esc(err.message);});})();
</script></body></html>
