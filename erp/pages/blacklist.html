<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>买家黑名单 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>.empty{padding:70px;text-align:center;color:var(--text-faint)}.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}dialog{width:min(540px,calc(100vw - 30px));padding:0;border:0;border-radius:10px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0f172a66}.dh,.df{display:flex;padding:16px 20px}.dh{justify-content:space-between;border-bottom:1px solid var(--line)}.df{justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.db{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:20px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}.full{grid-column:1/-1}.field .input{width:100%}</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body>
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>买家黑名单</strong><span class="breadcrumb">网研ERP <span>/</span> 订单 <span>/</span> 买家黑名单</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page">
<div class="stats-grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat-card"><h4>黑名单总数</h4><div class="value" id="allStat">0</div><div class="trend">当前租户</div></div><div class="stat-card"><h4>今日新增</h4><div class="value" id="todayStat">0</div><div class="trend">按录入时间统计</div></div><div class="stat-card"><h4>关联订单数</h4><div class="value" id="ordersStat">0</div><div class="trend">仅统计已录入数据</div></div></div>
<div class="filter-bar"><input class="input" id="keyword" placeholder="搜索买家昵称 / 订单号"><select class="select" id="reason"><option value="">全部原因</option></select><select class="select" id="shop"><option value="">全部店铺</option></select><button class="btn btn-primary" id="searchBtn">搜索</button><span class="spacer"></span><button class="btn btn-primary" id="createBtn">＋ 手动加入</button></div>
<section class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>买家昵称/ID</th><th>订单号</th><th>店铺</th><th>订单数</th><th>拉黑原因</th><th>拉黑时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div class="foot" id="count">共 0 条记录</div></section></main></div>
<dialog id="editor" class="ui-page"><form id="form"><div class="dh"><b>加入买家黑名单</b><button type="button" class="icon-btn" id="closeBtn">×</button></div><div class="db"><label class="field full">买家昵称或 ID<input class="input" id="eBuyer" required maxlength="160"></label><label class="field">订单号<input class="input" id="eOrder" maxlength="100"></label><label class="field">店铺<input class="input" id="eShop" maxlength="120"></label><label class="field">拉黑原因<input class="input" id="eReason" required maxlength="120"></label><label class="field">关联订单数<input class="input" id="eCount" type="number" min="0" value="0"></label><label class="field full">备注<input class="input" id="eNote" maxlength="300"></label></div><div class="df"><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn btn-primary">保存</button></div></form></dialog>
<script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/message-data.js"></script><script src="../assets/table-pagination.js?v=20261002-b07b2"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var KEY='erp_message_blacklist',m=window.WYERP_MESSAGE_DATA,list=[];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function opts(id,label,vals){var s=document.getElementById(id),cur=s.value;vals=vals.filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});s.innerHTML='<option value="">'+label+'</option>'+vals.map(function(v){return'<option>'+esc(v)+'</option>';}).join('');if(vals.indexOf(cur)>=0)s.value=cur;}function isToday(v){var d=new Date(v),n=new Date();return!isNaN(d)&&d.toDateString()===n.toDateString();}
function render(){allStat.textContent=list.length;todayStat.textContent=list.filter(function(v){return isToday(v.createdAt);}).length;ordersStat.textContent=list.reduce(function(n,v){return n+v.orderCount;},0);var rows=m.filterBlocked(list,{keyword:keyword.value,reason:reason.value,shop:shop.value});count.textContent='共 '+rows.length+' 条记录';body.innerHTML=rows.length?rows.map(function(v){return'<tr><td>'+esc(v.buyer)+'</td><td>'+esc(v.orderNo||'--')+'</td><td>'+esc(v.shop||'--')+'</td><td>'+v.orderCount+'</td><td><span class="badge badge-red">'+esc(v.reason)+'</span></td><td>'+esc(v.createdAt||'--')+'</td><td><button class="link danger remove" data-id="'+esc(v.id)+'">解除</button></td></tr>';}).join(''):'<tr><td colspan="7"><div class="empty">暂无黑名单记录</div></td></tr>';}
function save(){erpStorage.set(KEY,list);opts('reason','全部原因',list.map(function(v){return v.reason;}));opts('shop','全部店铺',list.map(function(v){return v.shop;}));render();}createBtn.onclick=function(){form.reset();eCount.value=0;editor.showModal();};closeBtn.onclick=cancelBtn.onclick=function(){editor.close();};searchBtn.onclick=render;body.onclick=function(e){var b=e.target.closest('.remove');if(b&&confirm('确定解除该买家黑名单？')){list=m.removeBlocked(list,b.dataset.id);save();}};form.onsubmit=function(e){e.preventDefault();list=m.upsertBlocked(list,{id:crypto.randomUUID?crypto.randomUUID():'b-'+Date.now(),buyer:eBuyer.value,orderNo:eOrder.value,shop:eShop.value,reason:eReason.value,note:eNote.value,orderCount:eCount.value,createdAt:new Date().toISOString()});editor.close();save();};erpStorage.init([KEY]).then(function(){list=m.blockedList(erpStorage.get(KEY));save();});
})();</script></body></html>
