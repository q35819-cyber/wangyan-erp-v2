<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>分析 - 网研ERP</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .analysis-page { --accent: var(--primary); }
  .analysis-page .content { padding: 16px 20px 24px; }

  /* 筛选栏 */
  .ana-filter {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px;
  }
  .ana-filter label { font-size: 12px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .ana-filter .input, .ana-filter select.select { height: 32px; font-size: 13px; }
  .ana-filter .shop-select { min-width: 180px; }
  .ana-filter .date-pair { display: inline-flex; align-items: center; gap: 4px; }
  html body .ana-filter .date-pair input[type="date"] { height: 32px !important; width: 140px !important; padding: 0 10px !important; border: 1px solid var(--line, #e2e8f0) !important; border-radius: 8px !important; background: var(--card, #fff) !important; color: var(--text, #1e293b) !important; font-size: 12px !important; outline: none !important; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; }
  html body .ana-filter .date-pair input[type="date"]:hover { border-color: var(--primary, #2563EB) !important; }
  html body .ana-filter .date-pair input[type="date"]:focus { border-color: var(--primary, #2563EB) !important; box-shadow: 0 0 0 3px rgba(37,99,235,.12) !important; }
  .ana-filter .date-sep { color: var(--text-faint, #94a3b8); font-size: 12px; padding: 0 2px; }
  .ana-presets { display: inline-flex; gap: 4px; }
  .ana-presets button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text-muted); font-size: 12px; cursor: pointer;
    transition: all .15s;
  }
  .ana-presets button:hover { border-color: var(--primary); color: var(--primary); }
  .ana-presets button[data-active="true"] {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }
  /* 任务#40：数据源扩展按钮（天眼/订单管理/seerfar），三个按钮统一尺寸样式，参考刷新按钮体系 */
  .ana-src-btn {
    height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text-muted); font-size: 12px; font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: all .15s;
  }
  .ana-src-btn:hover { border-color: var(--primary); color: var(--primary); }
  .ana-price-note { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .ana-price-note s { color: var(--text-faint); margin-right: 4px; }
  .ana-price-note strong { color: var(--primary); }
  .ana-source-meta { font-size: 11px; color: var(--text-faint); margin-left: 8px; }
  .ana-table-tools { display:flex; align-items:center; gap:8px; }
  .ana-more-btn { height:30px; padding:0 10px; font-size:11px; }
  .metric-stack { line-height:1.45; white-space:nowrap; }
  .metric-stack small { display:block; color:var(--text-faint); font-size:10px; font-weight:400; }
  .ana-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 16px; font-size: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 9000; display: none;
  }

  /* KPI 卡片 */
  .ana-kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
  .ana-kpis.orders-kpi-layout { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ana-kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px 12px; position: relative; overflow: hidden;
  }
  .ana-kpi::before {
    content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px;
  }
  .ana-kpi.kpi-blue::before { background: #2563EB; }
  .ana-kpi.kpi-green::before { background: #16a34a; }
  .ana-kpi.kpi-amber::before { background: #d97706; }
  .ana-kpi.kpi-rose::before { background: #dc2626; }
  .ana-kpi.kpi-violet::before { background: #7c3aed; }
  .ana-kpi.kpi-cyan::before { background: #0891b2; }
  .ana-kpi .kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
  .ana-kpi .kpi-value { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.3px; line-height: 1.1; }
  .ana-kpi .kpi-value small { font-size: 12px; font-weight: 400; color: var(--text-faint); margin-left: 4px; }
  .ana-kpi .kpi-sub { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  /* 图表面板 */
  .ana-chart-panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .ana-chart-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .ana-chart-head h3 { font-size: 14px; font-weight: 700; color: var(--text); }
  .ana-chart-head span { font-size: 11px; color: var(--text-faint); }
  .ana-chart-wrap { width: 100%; height: 220px; }

  /* 分析数据功能页：参考在线商品状态页签，获取按钮只负责写入对应数据集。 */
  .ana-data-tabs-bar {
    display: flex; align-items: flex-end; min-height: 42px; margin: -2px 0 0;
    padding: 0 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px 10px 0 0; border-bottom: 0;
  }
  .ana-data-tabs { display: flex; align-items: flex-end; gap: 26px; min-width: 0; overflow-x: auto; }
  .ana-data-tab {
    border: 0; border-bottom: 2px solid transparent; background: transparent;
    color: var(--text-muted); padding: 11px 0 10px; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .ana-data-tab strong {
    display: inline-block; margin-left: 5px; padding: 1px 7px; border-radius: 10px;
    background: var(--surface-hover); font-size: 11px; font-weight: 600;
  }
  .ana-data-tab.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .ana-data-tab.on strong { background: var(--primary); color: #fff; }

  /* 表格 */
  .ana-table-panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 0 0 10px 10px; overflow: hidden;
  }
  .ana-table-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .ana-table-head h3 { font-size: 14px; font-weight: 700; color: var(--text); }
  /* 表格右上角搜索框复用全站 .search-input 规格（280px/36px/圆角8px/主题变量），此处只补搜索图标与左内边距 */
  .ana-table-head .search-box { position: relative; display: inline-flex; align-items: center; }
  .ana-table-head .search-box svg {
    position: absolute; left: 10px; width: 15px; height: 15px; color: var(--text-faint);
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  .ana-table-head .search-box input.search-input { padding-left: 32px !important; }
  .ana-table-wrap { max-height: 440px; overflow-y: auto; }
  .ana-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ana-table thead th {
    position: sticky; top: 0; background: var(--surface-hover);
    text-align: center; font-weight: 600; color: var(--text-muted);
    padding: 8px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none; white-space: normal; line-height: 1.3; min-width: 60px;
  }
  .ana-table thead th:hover { color: var(--primary); }
  .ana-table tbody td {
    padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--text);
  }
  .ana-table tbody tr:hover { background: var(--surface-hover); }
  .ana-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ana-table td.seq-cell { text-align:center; width:52px; min-width:52px; font-variant-numeric:tabular-nums; }
  .ana-table tbody tr.ana-total-row td { background: color-mix(in srgb, var(--primary) 7%, var(--card)); font-weight: 700; border-bottom: 1px solid color-mix(in srgb, var(--primary) 22%, var(--line)); }
  .ana-table tbody tr.ana-total-row:hover td { background: color-mix(in srgb, var(--primary) 10%, var(--card)); }
  .ana-total-main { color: var(--primary); font-weight: 800; }
  .ana-total-sub { display:block; margin-top:2px; color:var(--text-faint); font-size:10px; font-weight:500; white-space:nowrap; }
  .ana-table th.num { text-align: right; }
  .ana-table .sku-cell { width: 216px; min-width: 216px; max-width: 216px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .ana-table .sku-cell .sku-row { display: flex; align-items: flex-start; gap: 8px; }
  .ana-table .sku-cell .ana-thumb { flex: none; position: relative; }
  .ana-table .sku-cell .ana-thumb img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; display: block; background: var(--surface); border: 1px solid var(--line); cursor: zoom-in; transition: transform .12s ease; }
  .ana-table .sku-cell .ana-thumb .ana-thumb-ph { width: 40px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 18px; background: var(--surface, #f7f8fa); border: 1px solid var(--line); cursor: default; }
  .ana-table .sku-cell .ana-text { flex: 1; min-width: 0; }
  .ana-table .sku-cell .ana-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ana-table .sku-cell .ana-offer { display: block; font-weight: 400; color: var(--text-faint); font-size: 11px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ana-table .sku-cell .ana-sku { min-width:0; font-weight:400; color:var(--text-faint); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ana-table .sku-cell .ana-copy-line { display:flex; align-items:center; gap:3px; min-width:0; margin-top:1px; }
  .ana-table .sku-cell .ana-copy-line .inline-icon-btn { flex:0 0 22px; }
  #ana-img-zoom { position: fixed; pointer-events: none; z-index: 9999; display: none; padding: 6px; background: var(--card); border: 1px solid var(--popup-border,var(--line)); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
  #ana-img-zoom img { width: 400px; height: 400px; object-fit: cover; border-radius: 6px; display: block; }
  .ana-empty { text-align: center; color: var(--text-faint); padding: 48px 16px; font-size: 13px; }
  .ana-table thead th .sort { display: inline-flex; flex-direction: column; justify-content: center; gap: 2px; margin-left: 4px; vertical-align: middle; width: 8px; height: 16px; }
  .ana-table thead th .sort i { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .ana-table thead th .sort i.up { border-bottom: 5px solid #cbd5e1; }
  .ana-table thead th .sort i.down { border-top: 5px solid #cbd5e1; }
  .ana-table thead th[data-active-sort="asc"] .sort i.up { border-bottom-color: #2563EB; }
  .ana-table thead th[data-active-sort="desc"] .sort i.down { border-top-color: #7c3aed; }
  .ana-table .cat-cell { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted); font-size:12px; }
  .ana-table .category-cell { width:112px; min-width:112px; max-width:112px; }
  .ana-table .shop-cell-analysis { max-width:138px; }
  .ana-table th[data-col="product"] { width:216px; min-width:216px; max-width:216px; }
  .ana-table th[data-col="category"] { width:112px; min-width:112px; max-width:112px; }
  .ana-table td .dim { color: var(--text-faint); }

  @media (max-width: 1100px) { .ana-kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px) { .ana-kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
<script src="../assets/theme-restore.js"></script>
</head>
<body class="analysis-page">
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div>
<div class="main-content">
  <div class="header"><div class="header-left"><strong>分析</strong><span class="breadcrumb">网研ERP <span>/</span> 分析</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div>
  <main class="content ui-page">

    <div class="ana-filter">
      <label>店铺</label>
      <select class="select shop-select" id="shopSelect"><option value="">全部店铺</option></select>
      <label>时间</label>
      <div class="ana-presets" id="presets">
        <button data-range="today">今天</button>
        <button data-range="yesterday">昨天</button>
        <button data-range="week">周</button>
        <button data-range="month" data-active="true">月</button>
        <button data-range="quarter">季度</button>
        <button data-range="year">年</button>
        <button data-range="all">全部</button>
      </div>
      <div class="date-pair" id="datePair">
        <input class="input" id="dateFrom" type="date">
        <span class="date-sep">→</span>
        <input class="input" id="dateTo" type="date">
      </div>
      <button class="btn btn-primary" id="refreshBtn">刷新</button>
      <button class="ana-src-btn" id="srcOrdersBtn" type="button" data-ana-tip="数据来源：ERP已同步订单&#10;不消耗AI豆">获取订单数据</button>
      <button class="ana-src-btn" id="srcTianyanBtn" type="button" data-ana-tip="数据来源：Ozon Seller分析 / 天眼&#10;按分析页当前选择的起止日期获取&#10;已接入17项天眼指标&#10;单日趋势按小时，多日趋势按日期&#10;同店铺同周期当天缓存复用">获取天眼数据</button>
      <button class="ana-src-btn" id="srcSeerfarBtn" type="button" data-ana-tip="数据来源：Seerfar&#10;固定近30天&#10;价格读取系统管理员当前配置">获取seerfar数据</button>
      <span class="ana-price-note" id="seerfarPriceNote"><strong>正在读取价格…</strong></span>
    </div>

    <div class="ana-kpis" id="kpiRow" hidden>
      <div class="ana-kpi kpi-blue"><div class="kpi-label">订购商品数量</div><div class="kpi-value" data-kpi="units">--<small>件</small></div><div class="kpi-sub" data-kpi="unitsSub"></div></div>
      <div class="ana-kpi kpi-green"><div class="kpi-label">订购金额</div><div class="kpi-value" data-kpi="revenue">--<small>₽</small></div><div class="kpi-sub" data-kpi="revenueSub"></div></div>
      <div class="ana-kpi kpi-amber"><div class="kpi-label">涉及商品</div><div class="kpi-value" data-kpi="products">--<small>SKU</small></div><div class="kpi-sub" data-kpi="productsSub"></div></div>
      <div class="ana-kpi kpi-rose"><div class="kpi-label">已取消订单</div><div class="kpi-value" data-kpi="cancelled">--<small>单</small></div><div class="kpi-sub" data-kpi="cancelledSub"></div></div>
      <div class="ana-kpi kpi-violet"><div class="kpi-label">唯一访问者</div><div class="kpi-value" data-kpi="visitors">--<small>人</small></div><div class="kpi-sub" data-kpi="visitorsSub">待扩展采集</div></div>
      <div class="ana-kpi kpi-cyan"><div class="kpi-label">整体转化率</div><div class="kpi-value" data-kpi="conversion">--</div><div class="kpi-sub" data-kpi="conversionSub">待扩展采集</div></div>
    </div>

    <div class="ana-chart-panel" id="chartPanel" hidden>
      <div class="ana-chart-head"><h3 id="chartTitle">订购商品数量（按天）</h3><span id="chartRange"></span></div>
      <div class="ana-chart-wrap" id="chartWrap" style="width:100%;height:260px;"></div>
    </div>

    <div class="ana-data-tabs-bar" id="analysisDataTabsBar">
      <div class="ana-data-tabs" id="analysisDataTabs" role="tablist" aria-label="分析数据来源">
        <button class="ana-data-tab on" type="button" data-analysis-tab="all">所有 <strong id="tabCountAll">0</strong></button>
        <button class="ana-data-tab" type="button" data-analysis-tab="orders">订单数据 <strong id="tabCountOrders">0</strong></button>
        <button class="ana-data-tab" type="button" data-analysis-tab="tianyan">天眼数据 <strong id="tabCountTianyan">0</strong></button>
        <button class="ana-data-tab" type="button" data-analysis-tab="seerfar">Seerfar数据 <strong id="tabCountSeerfar">0</strong></button>
      </div>
    </div>

    <div class="ana-table-panel" id="tablePanel" hidden>
      <div class="ana-table-head">
        <div><h3 id="tableTitle">全部来源商品明细</h3><span class="ana-source-meta" id="sourceMeta">数据源：订单 + 天眼 + Seerfar · 同店铺按SKU合并 · 仅显示非空列</span></div>
        <div class="ana-table-tools">
          <button class="btn ana-more-btn" id="seerfarMoreBtn" type="button" hidden>继续获取下100条</button>
          <div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input class="input search-input" id="skuSearch" placeholder="搜索 SKU / 商品名"></div>
        </div>
      </div>
      <div class="ana-table-wrap">
        <table class="ana-table" id="anaTable">
          <thead id="anaHead"></thead>
          <tbody id="anaBody"></tbody>
        </table>
      </div>
    </div>

    <div class="ana-empty" id="emptyHint">正在加载数据...</div>

  </main>
</div>
<div class="ana-toast" id="anaToast" role="status"></div>

<script>
(function(){'use strict';

var shops=[], orders=[], shopOptions=[], onlineProductByShopSku={};
var activePreset='month', customFrom='', customTo='', activeSource='all';
var tianyanRows=[], tianyanByRange={}, tianyanMetaByRange={}, activeTianyanRangeKey='', seerfarByShop={};
var seerfarRows=[], seerfarSummary=null, seerfarShopId='', seerfarNextPage=1, seerfarHasNextPage=false, seerfarFetchedAt='', seerfarChargedBean=0;
var seerfarRequestKeys={}, seerfarSucceededPages={};
var seerfarPriceBean=null;
var orderStatistics=window.WYERP_ORDER_STATISTICS, analysisCache=window.WYERP_SHOP_ANALYSIS_CACHE, actionIcons=window.WYERP_INLINE_ACTION_ICONS, skuMask=window.WYERP_SKU_MASK, ozonProductLink=window.WYERP_OZON_PRODUCT_LINK;
var analysisCacheScope='',analysisCacheDate='';
if(!orderStatistics||!analysisCache||!actionIcons||!skuMask||!ozonProductLink)throw new Error('分析页订单统计、缓存、行内图标、SKU掩码或Ozon商品链接模块加载失败');
function applySeerfarPrice(pricing){
  var item=pricing&&pricing.analysis?pricing.analysis:pricing;
  var value=Number(item&&(item.effectiveBean!=null?item.effectiveBean:item.beanPerBatch));
  if(!Number.isFinite(value)||value<=0)return;
  seerfarPriceBean=value;
  document.getElementById('seerfarPriceNote').innerHTML='<strong>'+value+' AI豆/100条</strong>';
  document.getElementById('srcSeerfarBtn').dataset.anaTip='数据来源：Seerfar\\n数据范围：固定近30天\\n计费：'+value+' AI豆/100条\\n不足100条仍按一批计费';
  document.getElementById('seerfarMoreBtn').textContent='继续获取下100条（'+value+' AI豆）';
}
function loadAiPricing(){
  return erpStorage.request('/api/domain/ai-pricing').then(function(response){return response.json().then(function(data){if(response.ok)applySeerfarPrice(data.pricing);});}).catch(function(){});
}

function fmt(n, digits){if(!Number.isFinite(+n))return'--';return Number(+n).toLocaleString('zh-CN',{maximumFractionDigits:digits==null?0:digits});}
function amountNumber(value){return orderStatistics.number(value);}
function orderAmountCny(order){return orderStatistics.orderAmountCny(order,order&&order.finance);}
function orderAmountRub(order){
  var value=orderStatistics.actualRevenueRub(order&&order.finance);
  return value===null||value===undefined||!Number.isFinite(Number(value))?null:Math.round(Number(value)*100)/100;
}
function moneyValue(value,currency){var n=nullNumber(value);if(n===null)return'<span class="dim">—</span>';return currency==='RUB'?fmt(n,2)+' ₽':'¥'+fmt(n,2);}
function maskSku(value){return skuMask.mask(value);}
function copyIcon(){return actionIcons.copy();}
function firstCategory(value){
  var full=String(value||'').trim();
  if(!full)return'--';
  return (full.split(/\s*(?:>|＞|\/)\s*/)[0]||full).trim()||full;
}
function categoryCell(value){
  var full=String(value||'').trim();
  return '<td class="cat-cell category-cell" data-ana-tip="'+esc(full)+'">'+esc(full?firstCategory(full):'--')+'</td>';
}

function dateOf(v){if(!v)return null;var d=new Date(v);if(isNaN(d.getTime()))return null;return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmtDate(d){if(!d)return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function rangePreset(key){
  var now=new Date();now.setHours(23,59,59,999);
  var today=new Date();today.setHours(0,0,0,0);
  switch(key){
    case 'today': return {start:today, end:now};
    case 'yesterday': {
      var y=new Date(today);y.setDate(y.getDate()-1);
      var ye=new Date(y);ye.setHours(23,59,59,999);
      return {start:y, end:ye};
    }
    case 'week': {
      // 本周一到今天
      var w=new Date(today);var dow=w.getDay();if(dow===0)dow=7;w.setDate(w.getDate()-(dow-1));
      return {start:w, end:now};
    }
    case 'month': {
      var m=new Date(today);m.setDate(m.getDate()-29);
      return {start:m, end:now};
    }
    case 'quarter': {
      var q=new Date(today.getFullYear(),Math.floor(today.getMonth()/3)*3,1);
      return {start:q, end:now};
    }
    case 'year': {
      var y=new Date(today.getFullYear(),0,1);
      return {start:y, end:now};
    }
    default: return {start:new Date(today.getFullYear(),today.getMonth(),1), end:now};
  }
}

function onlineProductAliases(p){
  var out=[];
  [p&&p.article,p&&p.sku,p&&p.productId,p&&p.offer_id,p&&p.offerId,p&&p.id].forEach(function(value){
    value=String(value||'').trim();
    if(value&&out.indexOf(value)<0)out.push(value);
  });
  return out;
}
function onlineProductCategory(p){
  var rawLevels=[p&&p.cat1,p&&p.cat2,p&&p.cat3].map(function(v){return String(v||'').trim();}).filter(function(v,i,arr){return v&&arr.indexOf(v)===i;});
  var levels=rawLevels.map(function(v){var translated=typeof translateCat==='function'?String(translateCat(v)||'').trim():'';return translated||v;}).filter(function(v,i,arr){return v&&arr.indexOf(v)===i;});
  return levels.join(' > ')||String(p&&p.categoryPath||p&&p.category||'').trim();
}
function onlineProductLookupKey(shopName,sku){return String(shopName||'').trim()+'\u0000'+String(sku||'').trim();}
function indexOnlineProduct(p){
  if(!p)return;
  var shopName=String(p.shop||p.shopName||'').trim();
  if(!shopName)return;
  var meta={category:onlineProductCategory(p),img:String(p.img||p.image||p.primaryImage||p.imageUrl||'').trim(),source:'erp_online_products'};
  onlineProductAliases(p).forEach(function(alias){onlineProductByShopSku[onlineProductLookupKey(shopName,alias)]=meta;});
}
function onlineProductMeta(shopName,candidates){
  shopName=String(shopName||'').trim();
  candidates=Array.isArray(candidates)?candidates:[candidates];
  for(var i=0;i<candidates.length;i++){
    var sku=String(candidates[i]||'').trim();
    if(!shopName||!sku)continue;
    var meta=onlineProductByShopSku[onlineProductLookupKey(shopName,sku)];
    if(meta)return meta;
  }
  return null;
}
function enrichIdentityFromOnline(row){
  if(!row)return row;
  var meta=onlineProductMeta(row.shopName,[row.sku,row.offerId,row.productId]);
  if(meta){
    if(!row.category&&meta.category)row.category=meta.category;
    if(!row.img&&meta.img)row.img=meta.img;
  }
  return row;
}
function loadShops(){
  shops=Array.isArray(erpStorage.get('erp_shops_data'))?erpStorage.get('erp_shops_data'):[];
  orders=Array.isArray(erpStorage.get('erp_orders_data'))?erpStorage.get('erp_orders_data'):[];
  var prods=Array.isArray(erpStorage.get('erp_online_products'))?erpStorage.get('erp_online_products'):[];
  onlineProductByShopSku={};
  prods.forEach(indexOnlineProduct);
  shopOptions=[];
  var seen={};
  shops.forEach(function(s){
    if(!s)return;
    var name=String(s.name||'').trim();if(!name)return;
    var id=String(s.externalShopId||s.clientId||s.id||'').trim();
    var key=id||('name:'+name);
    if(seen[key])return;seen[key]=true;
    shopOptions.push({name:name,id:id});
  });
  shopOptions.sort(function(a,b){return a.name.localeCompare(b.name,'zh');});
  var sel=document.getElementById('shopSelect');
  var previousShop=sel.value;
  function optionValue(item){return item.id?'id:'+item.id:'name:'+item.name;}
  sel.innerHTML='<option value="">全部店铺</option>'+shopOptions.map(function(s){return'<option value="'+esc(optionValue(s))+'">'+esc(s.name)+'</option>';}).join('');
  sel.value=shopOptions.some(function(item){return optionValue(item)===previousShop;}) ? previousShop : '';
}

function orderShopId(o){return String(o.clientId||o.externalShopId||o.shop_external_id||'').trim();}
function matchShop(o,s){
  if(!s)return true;
  var oid=orderShopId(o);
  // A name is not a trusted identifier: never combine different shop IDs just because labels match.
  if(s.id)return !!oid&&oid===s.id;
  return !oid&&String(o.shop||o.shopName||'').trim()===s.name;
}
function shopNameById(id,fallback){
  id=String(id||'').trim();
  for(var i=0;i<shopOptions.length;i++)if(id&&String(shopOptions[i].id||'')===id)return shopOptions[i].name;
  return String(fallback||id||'未知店铺').trim();
}
function orderShopInfo(o){
  var id=orderShopId(o);
  var name=String(o&&(o.shop||o.shopName)||'').trim();
  name=shopNameById(id,name);
  return {id:id,name:name,key:id?('id:'+id):('name:'+name)};
}
function rowMatchesSelectedShop(row){
  var sel=selectedShop();
  if(!sel)return true;
  var rid=String(row&&row.shopId||'').trim();
  var rname=String(row&&row.shopName||'').trim();
  if(sel.id&&rid)return rid===sel.id;
  return rname===sel.name;
}
function selectedShop(){
  var v=document.getElementById('shopSelect').value;
  for(var i=0;i<shopOptions.length;i++){
    var expected=shopOptions[i].id?'id:'+shopOptions[i].id:'name:'+shopOptions[i].name;
    if(expected===v)return shopOptions[i];
  }
  return null;
}
function orderDateOf(o){return dateOf(o.acceptedAt||o.accepted_at||o.trackDate||o.date||o.orderTime);}
function filterOrders(){
  var sel=selectedShop();
  var range=activePreset==='custom'?rangeCustom(customFrom,customTo):(activePreset==='all'?null:rangePreset(activePreset));
  // 同步日期框显示（预设模式）
  if(range){
    document.getElementById('dateFrom').value=fmtDate(range.start);
    document.getElementById('dateTo').value=fmtDate(range.end);
  } else {
    document.getElementById('dateFrom').value='';
    document.getElementById('dateTo').value='';
  }
  return orders.filter(function(o){
    if(!o)return false;
    if(sel&&!matchShop(o,sel))return false;
    if(!range)return true; // all 模式不过滤日期
    var d=orderDateOf(o);
    if(!d)return false;
    d.setHours(0,0,0,0);
    return d>=range.start&&d<=range.end;
  });
}

function rangeCustom(f,t){var s=dateOf(f),e=dateOf(t);if(!s){s=new Date();s.setHours(0,0,0,0);}if(!e){e=new Date();e.setHours(23,59,59,999);}s.setHours(0,0,0,0);e.setHours(23,59,59,999);return{start:s,end:e};}

function aggregate(filtered,options){
  options=options||{};
  var separateShops=options.byShop===true;
  var byDate={},bySku={};
  var totalUnits=0,totalRevenue=0,totalRevenueRub=0,totalRevenueSeen=false,totalRevenueRubSeen=false,cancelled=0,returned=0;

  filtered.forEach(function(o){
    if(o.status==='已取消')cancelled++;
    var ret=o.ret||'';
    if(ret==='在仓库'||ret==='已到退货仓库'||ret==='正在运往仓库'||ret==='已销毁'||o.retRel)returned++;

    var d=orderDateOf(o),key=d?fmtDate(d):'未知';
    if(!byDate[key])byDate[key]=0;
    var shopInfo=orderShopInfo(o);
    var items=(o.items||[]).filter(function(item){return !!item;});
    var actualCny=orderAmountCny(o),actualRub=orderAmountRub(o);
    if(actualCny!==null){totalRevenue+=actualCny;totalRevenueSeen=true;}
    if(actualRub!==null){totalRevenueRub+=actualRub;totalRevenueRubSeen=true;}

    var itemBases=items.map(function(item){
      var qty=amountNumber(item.qty!=null?item.qty:item.quantity),price=amountNumber(item.price);
      return qty!==null&&qty>0&&price!==null&&price>=0?qty*price:0;
    });
    var baseTotal=itemBases.reduce(function(sum,value){return sum+value;},0);
    var qtyTotal=items.reduce(function(sum,item){
      var qty=amountNumber(item.qty!=null?item.qty:item.quantity);
      return sum+(qty!==null&&qty>0?qty:0);
    },0);

    items.forEach(function(item,itemIndex){
      var sku=String(item.sku||item.offerId||item.offer_id||'');
      var offerId=String(item.offerId||item.offer_id||'');
      var name=String(item.name||item.title||sku||'未知');
      var qty=amountNumber(item.qty!=null?item.qty:item.quantity);
      var units=qty!==null?qty:0;
      var share=items.length<=1?1:(baseTotal>0?itemBases[itemIndex]/baseTotal:(qtyTotal>0?units/qtyTotal:1/items.length));
      var revenue=actualCny!==null?actualCny*share:(itemBases[itemIndex]||null);
      var revenueRub=actualRub!==null?actualRub*share:null;

      byDate[key]+=units;
      totalUnits+=units;
      var identity=sku||offerId||name;
      var rowKey=(separateShops?shopInfo.key+'|':'')+identity;
      if(!bySku[rowKey]){
        var onlineMeta=onlineProductMeta(shopInfo.name,[sku,offerId,item.productId,item.id]);
        bySku[rowKey]={
          shopId:shopInfo.id,shopName:shopInfo.name,shopKey:shopInfo.key,
          sku:sku,offerId:offerId,name:name,
          category:String(item.category||item.categoryPath||'').trim()||(onlineMeta&&onlineMeta.category)||'',
          img:String(item.img||item.image||item.imageUrl||'').trim()||(onlineMeta&&onlineMeta.img)||'',
          units:0,revenue:0,revenueSeen:false,revenueRub:0,revenueRubSeen:false,orders:0,cancelled:0,returned:0
        };
      }
      bySku[rowKey].units+=units;
      if(revenue!==null){bySku[rowKey].revenue+=revenue;bySku[rowKey].revenueSeen=true;}
      if(revenueRub!==null){bySku[rowKey].revenueRub+=revenueRub;bySku[rowKey].revenueRubSeen=true;}
      bySku[rowKey].orders++;
      if(o.status==='已取消')bySku[rowKey].cancelled++;
      if(ret==='在仓库'||ret==='已到退货仓库'||ret==='正在运往仓库'||ret==='已销毁'||o.retRel)bySku[rowKey].returned++;
    });
  });

  var skuList=Object.values(bySku).map(function(row){
    row.revenue=row.revenueSeen?Math.round(row.revenue*100)/100:null;
    row.revenueRub=row.revenueRubSeen?Math.round(row.revenueRub*100)/100:null;
    delete row.revenueSeen;delete row.revenueRubSeen;
    return row;
  }).sort(function(a,b){return b.units-a.units;});

  return {
    totalUnits:totalUnits,
    totalRevenue:totalRevenueSeen?Math.round(totalRevenue*100)/100:null,
    totalRevenueRub:totalRevenueRubSeen?Math.round(totalRevenueRub*100)/100:null,
    productCount:skuList.length,cancelled:cancelled,returned:returned,
    daily:Object.keys(byDate).sort().map(function(k){return{date:k,units:byDate[k]};}),
    skus:skuList
  };
}

function tianyanTimelineSeries(timeline){
  var points=timeline&&Array.isArray(timeline.points)?timeline.points:[];
  var defs=[
    ['ordered_units','订购数量'],
    ['session_view','唯一访问者'],
    ['hits_view','浏览总量'],
    ['hits_tocart','加购总量']
  ];
  var available=[];
  defs.forEach(function(def){
    var values=points.map(function(point){return nullNumber(point&&point.values&&point.values[def[0]]);});
    var hasAny=values.some(function(value){return value!==null;});
    var hasNonZero=values.some(function(value){return value!==null&&value!==0;});

function totalNumericValues(rows,key,positiveOnly){
  var values=[],hadNumber=false;
  (Array.isArray(rows)?rows:[]).forEach(function(row){
    var n=nullNumber(row&&row[key]);
    if(n===null)return;
    hadNumber=true;
    if(!positiveOnly||n>0)values.push(n);
  });
  return{values:values,hadNumber:hadNumber};
}
function sumRows(rows,key){
  var info=totalNumericValues(rows,key,false);
  if(!info.hadNumber)return null;
  return info.values.reduce(function(sum,n){return sum+n;},0);
}
function avgRows(rows,key,positiveOnly){
  var info=totalNumericValues(rows,key,positiveOnly===true);
  if(!info.values.length)return info.hadNumber?0:null;
  return info.values.reduce(function(sum,n){return sum+n;},0)/info.values.length;
}
function weightedAvgRows(rows,valueKey,weightKey){
  var weighted=0,totalWeight=0,fallback=[];
  (Array.isArray(rows)?rows:[]).forEach(function(row){
    var value=nullNumber(row&&row[valueKey]);if(value===null)return;
    fallback.push(value);
    var weight=nullNumber(row&&row[weightKey]);
    if(weight!==null&&weight>0){weighted+=value*weight;totalWeight+=weight;}
  });
  if(totalWeight>0)return weighted/totalWeight;
  if(!fallback.length)return null;
  return fallback.reduce(function(sum,n){return sum+n;},0)/fallback.length;
}
function ratioRows(rows,numeratorKey,denominatorKey){
  var numerator=sumRows(rows,numeratorKey),denominator=sumRows(rows,denominatorKey);
  if(numerator===null||denominator===null)return null;
  if(denominator===0)return 0;
  return numerator/denominator*100;
}

function tianyanRowsForView(){return tianyanRows.filter(rowMatchesSelectedShop);}
function tianyanMetaForView(){
  var byShop=tianyanMetaByRange[String(activeTianyanRangeKey||'')]||{};
  var sel=selectedShop(), metas=[];
  Object.keys(byShop).forEach(function(shopId){
    if(sel&&sel.id&&String(sel.id)!==String(shopId))return;
    var meta=byShop[shopId];if(meta&&typeof meta==='object')metas.push(meta);
  });
  if(!metas.length)return null;
  if(metas.length===1)return metas[0];

  var additive=['ordered_units','revenue','session_view','session_view_search','session_view_pdp','hits_view_search','hits_view_pdp','hits_view','hits_tocart_search','hits_tocart_pdp','hits_tocart','cancellations','returns'];
  var summary={},positionValues=[];
  metas.forEach(function(meta){
    var source=meta.summary&&typeof meta.summary==='object'?meta.summary:{};
    additive.forEach(function(key){var n=nullNumber(source[key]);if(n!==null)summary[key]=(summary[key]||0)+n;});
    var pos=nullNumber(source.position_category);if(pos!==null&&pos>0)positionValues.push(pos);
  });
  if(positionValues.length)summary.position_category=positionValues.reduce(function(a,b){return a+b;},0)/positionValues.length;
  if(hasValue(summary.hits_tocart)&&hasValue(summary.session_view))summary.conv_tocart=summary.session_view===0?0:summary.hits_tocart/summary.session_view*100;
  if(hasValue(summary.hits_tocart_search)&&hasValue(summary.session_view_search))summary.conv_tocart_search=summary.session_view_search===0?0:summary.hits_tocart_search/summary.session_view_search*100;
  if(hasValue(summary.hits_tocart_pdp)&&hasValue(summary.session_view_pdp))summary.conv_tocart_pdp=summary.session_view_pdp===0?0:summary.hits_tocart_pdp/summary.session_view_pdp*100;

  var timelineMap={},granularity='';
  metas.forEach(function(meta){
    var timeline=meta.timeline&&typeof meta.timeline==='object'?meta.timeline:null;
    if(!timeline||!Array.isArray(timeline.points))return;
    if(!granularity)granularity=String(timeline.granularity||'');
    timeline.points.forEach(function(point){
      var key=String(point&&point.key||point&&point.label||'');if(!key)return;
      if(!timelineMap[key])timelineMap[key]={key:key,label:String(point.label||key),values:{}};
      var values=point.values&&typeof point.values==='object'?point.values:{};
      additive.forEach(function(metric){var n=nullNumber(values[metric]);if(n!==null)timelineMap[key].values[metric]=(timelineMap[key].values[metric]||0)+n;});
    });
  });
  var points=Object.keys(timelineMap).sort().map(function(key){return timelineMap[key];});
  return{
    shopId:'all',dateFrom:metas[0].dateFrom,dateTo:metas[0].dateTo,capturedAt:'',
    summary:summary,timeline:points.length?{granularity:granularity||'day',points:points,failedPoints:0}:null,
    totalCount:metas.reduce(function(sum,meta){return sum+(Number(meta.totalCount)||0);},0)
  };
}

function tianyanRequestRange(){
  var from=String(document.getElementById('dateFrom').value||'').trim();
  var to=String(document.getElementById('dateTo').value||'').trim();

    if(activePreset==='all')return{dateFrom:'',dateTo:'',days:0};

    if(preset){from=fmtDate(preset.start);to=fmtDate(preset.end);}
  }

  var days=Number.isFinite(start)&&Number.isFinite(end)&&end>=start?Math.floor((end-start)/86400000)+1:0;
  return{dateFrom:from,dateTo:to,days:days};
}
function workspaceBridgeWindow(){try{return window.top&&window.top!==window?window.top:window;}catch(_){return window;}}
function requestTianyanRangeFromPlugin(shop,range){
  return new Promise(function(resolve,reject){
    var bridge=workspaceBridgeWindow();
    var requestId='tianyan-range-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
    var waitMs=range.days<=1?80000:(range.days<=7?120000:190000);
    var settled=false;
    var ackTimer=setTimeout(function(){fail('当前ERP页面没有检测到同一浏览器里的网研ERP插件。请用已安装插件的同一浏览器打开ERP，并刷新页面后重试。','same_browser_plugin_missing');},1800);
    var timer=setTimeout(function(){fail('读取当前天眼周期超时，请确认 Ozon Seller“我的分析”页面已打开并刷新。','tianyan_read_timeout');},waitMs);
    function cleanup(){
      clearTimeout(ackTimer);clearTimeout(timer);
      bridge.removeEventListener('wyerp:tianyan-range-bridge-ack',onAck);
      bridge.removeEventListener('wyerp:tianyan-range-result',onResult);
    }
    function fail(message,code){
      if(settled)return;settled=true;cleanup();
      var error=new Error(message||'天眼周期读取失败。');error.code=code||'tianyan_read_failed';reject(error);
    }
    function onAck(event){
      var detail=event&&event.detail||{};if(detail.requestId!==requestId)return;
      clearTimeout(ackTimer);
    }
    function onResult(event){
      var detail=event&&event.detail||{};if(detail.requestId!==requestId)return;
      if(detail.ok!==true){fail(detail.message||'天眼周期读取失败。',detail.code||'tianyan_read_failed');return;}
      if(settled)return;settled=true;cleanup();resolve(detail.data||{});
    }
    bridge.addEventListener('wyerp:tianyan-range-bridge-ack',onAck);
    bridge.addEventListener('wyerp:tianyan-range-result',onResult);
    try{
      bridge.dispatchEvent(new bridge.CustomEvent('wyerp:tianyan-range',{detail:{
        requestId:requestId,clientId:shop.id,dateFrom:range.dateFrom,dateTo:range.dateTo
      }}));
    }catch(error){fail('天眼插件桥调用失败，请刷新ERP页面后重试。','plugin_bridge_failed');}
  });
}

function fetchTianyanCachedData(){
  var shop=selectedShop();activeSource='tianyan';sortKey='units';sortDir=-1;
  if(!shop||!shop.id){renderTianyanView();showAnaToast('请先选择一个具体店铺，再获取天眼数据');return Promise.resolve();}
  var range=tianyanRequestRange();
  if(!range.dateFrom||!range.dateTo||range.days<1||range.days>90){
    renderTianyanView();showAnaToast('天眼只支持当前选择的1至90天日期范围，请先选择昨天、周、月或自定义日期');return Promise.resolve();
  }
  var rangeKey=range.dateFrom+'..'+range.dateTo;
  var cachedRows=tianyanByRange[rangeKey]&&tianyanByRange[rangeKey][String(shop.id)];
  var cachedMeta=tianyanMetaByRange[rangeKey]&&tianyanMetaByRange[rangeKey][String(shop.id)];
  if(Array.isArray(cachedRows)&&cachedRows.length&&cachedMeta&&cachedMeta.timeline&&Array.isArray(cachedMeta.timeline.points)&&cachedMeta.timeline.points.length){
    activateTianyanRange(rangeKey);
    showAnaToast('今天已获取过 '+range.dateFrom+' 至 '+range.dateTo+' 的天眼数据，已直接使用缓存');

  }

  var btn=document.getElementById('srcTianyanBtn'),oldText=btn.textContent;
  btn.disabled=true;btn.textContent='获取中…';

    var returnedShop=String(data.shopId||'').trim();
    if(returnedShop&&returnedShop!==String(shop.id))throw new Error('天眼返回店铺与当前选择店铺不一致，请切换到对应 Ozon Seller 店铺。');
    if(String(data.dateFrom||'')!==range.dateFrom||String(data.dateTo||'')!==range.dateTo)throw new Error('天眼返回的日期范围与分析页当前筛选不一致。');

    var incomingRows=Array.isArray(data.rows)?data.rows:[];
    var normalizedIncoming=incomingRows.map(function(item){return normalizeTianyanCacheRow(item,shop,data);}).filter(usableTianyanProductRow);
    var normalizedRows=Array.isArray(cachedRows)&&cachedRows.length?cachedRows:normalizedIncoming;
    var meta={
      shopId:String(shop.id),dateFrom:range.dateFrom,dateTo:range.dateTo,
      capturedAt:String(data.capturedAt||new Date().toISOString()),
      headers:Array.isArray(data.headers)?data.headers:[],
      summary:data.summary&&typeof data.summary==='object'?data.summary:{},
      timeline:data.timeline&&typeof data.timeline==='object'?data.timeline:null,
      totalCount:Number.isFinite(Number(data.totalCount))?Number(data.totalCount):normalizedRows.length
    };
    rememberTianyanRangeRows(rangeKey,shop.id,normalizedRows);
    rememberTianyanRangeMeta(rangeKey,shop.id,meta);
    activateTianyanRange(rangeKey);
    persistTianyanState(shop,meta,normalizedRows).catch(function(){});

    var failed=Number(meta.timeline&&meta.timeline.failedPoints)||0;
    var trendText=meta.timeline?(meta.timeline.granularity==='hour'?'按小时':'按日期'):'无趋势';
    showAnaToast('已获取 '+normalizedRows.length+' 条天眼数据 · '+range.dateFrom+' → '+range.dateTo+' · '+trendText+(failed?' · '+failed+' 个时间点失败':''));
    renderTianyanView();
    return data;
  }).catch(function(error){
    showAnaToast((error&&error.message)||'天眼数据获取失败。');
    renderTianyanView();
    throw error;
  }).finally(function(){btn.disabled=false;btn.textContent=oldText;});
}

function createAnalysisRequestKey(){

function fetchSeerfarPage(pageNumber,reset){
  var shop=selectedShop();
  if(!shop||!shop.id){showAnaToast('请先选择一个具体店铺，再获取Seerfar数据');renderSeerfarView();return Promise.resolve();}
  switchSeerfarShop(shop.id);
  var page=Number(pageNumber)||1;
  var succeeded=Boolean(seerfarSucceededPages[page]);
  if(!seerfarRequestKeys[page]||succeeded)seerfarRequestKeys[page]=createAnalysisRequestKey();
  var requestKey=seerfarRequestKeys[page];
  var btn=page===1?document.getElementById('srcSeerfarBtn'):document.getElementById('seerfarMoreBtn');
  btn.disabled=true;
  var oldText=btn.textContent;
  btn.textContent=page===1?'获取中…':'正在获取…';
  return erpStorage.request('/api/shop-analysis/seerfar',{
    method:'POST',
    headers:{'Content-Type':'application/json','Idempotency-Key':requestKey},
    body:JSON.stringify({shopId:shop.id,pageNumber:page})
  }).then(function(response){
    return response.json().catch(function(){return{};}).then(function(payload){
      if(!response.ok){var requestError=new Error(payload.message||'Seerfar数据获取失败，请稍后重试。');requestError.billingReleased=payload.billingReleased===true;throw requestError;}
      var data=payload.data&&typeof payload.data==='object'?payload.data:{};
      var products=Array.isArray(data.products)?data.products:[];
      if(reset||page===1){seerfarRows=[];seerfarSummary=data;seerfarChargedBean=0;}
      var seen={};seerfarRows.forEach(function(r){seen[String(r.sku)]=true;});
      products.forEach(function(product){var row=normalizeSeerfarProduct(product,shop);if(!seen[row.sku]){seen[row.sku]=true;seerfarRows.push(row);}});
      seerfarFetchedAt=String(payload.fetchedAt||'');
      seerfarHasNextPage=seerfarBatchHasNext(data,page,products);
      seerfarNextPage=seerfarHasNextPage?page+1:page;
      seerfarChargedBean+=Number(payload.billing&&payload.billing.chargedBean)||0;
      applySeerfarPrice(payload.pricing);
      seerfarSucceededPages[page]=true;
      saveSeerfarCurrentState();
      persistSeerfarState(shop.id).catch(function(){});
      if(payload.billing&&payload.billing.balanceBean!==null&&payload.billing.balanceBean!==undefined){
        showAnaToast('已获取 '+products.length+' 条，扣除 '+payload.billing.chargedBean+' AI豆，余额 '+payload.billing.balanceBean+' AI豆');
      }else showAnaToast('已获取 '+products.length+' 条Seerfar数据');
      renderSeerfarView();
      return payload;
    });
  }).catch(function(error){
    if(error&&error.billingReleased===true)delete seerfarRequestKeys[page];
    showAnaToast((error&&error.message)||'Seerfar数据获取失败，请稍后重试。');
    throw error;
  }).finally(function(){btn.disabled=false;btn.textContent=oldText;});
}

  if(!shop||!shop.id){renderSeerfarView();showAnaToast('请先选择一个具体店铺，再获取Seerfar数据');return;}
  switchSeerfarShop(shop.id);
  updateSourceChrome();
  fetchSeerfarPage(1,true).catch(function(){});
};
document.getElementById('analysisDataTabs').addEventListener('click',function(e){
  var tab=e.target.closest('[data-analysis-tab]');
  if(!tab)return;
  activeSource=tab.dataset.analysisTab;
  sortKey=activeSource==='all'?'orderUnits':activeSource==='seerfar'?'sales':'units';
  sortDir=-1;
  renderCurrentSource();
});
loadAiPricing();
document.getElementById('seerfarMoreBtn').onclick=function(){fetchSeerfarPage(seerfarNextPage,false).catch(function(){});};

// 表头排序
function copyAnalysisText(value,label,button){
  var text=String(value==null?'':value);
  function ok(){if(button){button.classList.add('copied');setTimeout(function(){button.classList.remove('copied');},900);}showAnaToast((label||'内容')+'已复制');}
  function fallback(){
    var area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
    try{document.execCommand('copy');ok();}catch(_){showAnaToast('复制失败，请重试');}
    document.body.removeChild(area);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fallback);else fallback();
}
document.getElementById('anaTable').addEventListener('click',function(e){
  var inlineCopy=e.target.closest('[data-inline-copy]');
  if(inlineCopy){copyAnalysisText(inlineCopy.dataset.inlineCopy,inlineCopy.dataset.copyLabel,inlineCopy);return;}
  var th=e.target.closest('th[data-sort]');
  if(!th)return;
  var key=th.dataset.sort;
  if(sortKey===key)sortDir=-sortDir;else{sortKey=key;sortDir=-1;}
  renderCurrentSource();
});

// ---- 商品图片加载失败回退（CSP 兼容，事件委托） ----
document.addEventListener('error',function(event){
  var t=event.target;
  if(t&&t.tagName==='IMG'&&t.hasAttribute('data-ana-img-fallback')){
    var parent=t.parentNode;
    if(parent&&parent.classList.contains('ana-thumb')){
      parent.innerHTML='<div class="ana-thumb-ph">🖼</div>';
    }
  }
},true);

// ---- 商品图片悬停放大：悬浮预览跟随鼠标 ----
var anaZoomEl=document.createElement('div');
anaZoomEl.id='ana-img-zoom';
document.body.appendChild(anaZoomEl);
function anaMoveZoom(e){
  if(anaZoomEl.style.display!=='block')return;
  var previewSize=400,padding=12;
  var left=e.clientX+18,top=e.clientY+18;
  if(left+previewSize>window.innerWidth-padding)left=e.clientX-previewSize-18;
  if(top+previewSize>window.innerHeight-padding)top=e.clientY-previewSize-18;
  anaZoomEl.style.left=Math.max(padding,left)+'px';
  anaZoomEl.style.top=Math.max(padding,top)+'px';
}
document.getElementById('anaTable').addEventListener('mouseover',function(e){
  var img=e.target.closest?e.target.closest('.ana-thumb img'):null;
  if(!img||!img.src)return;
  anaZoomEl.innerHTML='';
  var c=img.cloneNode(false);
  c.removeAttribute('onerror');
  c.removeAttribute('data-ana-img-fallback');
  c.style.width='400px';c.style.height='400px';
  anaZoomEl.appendChild(c);
  anaZoomEl.style.display='block';
  anaMoveZoom(e);
});
document.getElementById('anaTable').addEventListener('mouseout',function(e){
  var img=e.target.closest?e.target.closest('.ana-thumb img'):null;
  if(img)anaZoomEl.style.display='none';
});
document.getElementById('anaTable').addEventListener('mousemove',anaMoveZoom);

  loadShops();
  return restoreAnalysisDayCache();

  var r=rangePreset('month');

  refresh();
}).catch(function(err){
  document.getElementById('emptyHint').textContent='加载数据失败：'+(err.message||err);
});

})();
