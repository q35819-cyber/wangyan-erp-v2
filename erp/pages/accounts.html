<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子账号管理 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>
.permission-list{display:block}.empty{padding:70px;text-align:center;color:var(--text-faint)}dialog{width:min(720px,calc(100vw - 30px));padding:0;border:0;border-radius:10px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0f172a66}
/* #50 配置权限弹窗：与已验收 wy-modal 弹窗家族一致（圆角/边框/内部滚动/吸底操作栏），中文权限名为主标题，英文码弱化 */
#permissionDialog{width:min(860px,calc(100vw - 30px))}
#permissionDialog form{display:flex;flex-direction:column;max-height:min(86vh,780px)}
.perm-head{display:flex;align-items:center;gap:10px;padding:15px 22px;border-bottom:1px solid var(--line);flex:none}
.perm-head b{font-size:16px;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perm-count{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.perm-body{flex:1;min-height:0;overflow:auto;padding:18px 22px 20px;display:flex;flex-direction:column;gap:18px}
.perm-foot{display:flex;justify-content:flex-end;gap:10px;padding:13px 22px;border-top:1px solid var(--line);flex:none}
.perm-section{display:flex;flex-direction:column;gap:10px;min-width:0}
.perm-section-title{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:650;color:var(--text)}
.perm-section-title::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--primary)}
.perm-body .field .perm-scope-select{width:240px;max-width:100%}
.perm-hint{font-size:12px;color:var(--muted)}
.perm-shops{display:flex;flex-direction:column;gap:8px;min-width:0}
.perm-group{display:flex;flex-direction:column;gap:8px}
.perm-group+.perm-group{margin-top:14px}
.perm-group-title{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:8px}
.perm-item{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s}
.perm-item:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.perm-item:has(input:checked){border-color:color-mix(in srgb,var(--primary) 55%,var(--line));background:color-mix(in srgb,var(--primary) 7%,var(--card))}
.perm-item:focus-within{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:1px}
.perm-item input{width:15px;height:15px;margin:2px 0 0;accent-color:var(--primary);flex:none;cursor:pointer}
.perm-item-main{flex:1;min-width:0;display:flex;flex-direction:column}
.perm-item-name{display:block;font-size:13px;font-weight:600;color:var(--text)}
.perm-item-desc{display:block;margin-top:2px;font-size:11px;line-height:1.45;color:var(--muted)}
.perm-item-code{display:block;margin-top:4px;font-family:Consolas,'Courier New',monospace;font-size:10px;color:var(--text-faint);word-break:break-all}
.perm-empty{font-size:12px;color:var(--muted);padding:6px 2px}.dh,.df{display:flex;padding:16px 20px}.dh{justify-content:space-between;border-bottom:1px solid var(--line)}.df{justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.db{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}.full{grid-column:1/-1}.field .input,.field .select{width:100%}.notice{margin-bottom:14px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--primary) 28%,var(--line));border-radius:8px;background:color-mix(in srgb,var(--primary) 9%,var(--card));color:var(--primary);font-size:12px}.hidden{display:none!important}
</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body>
<div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>子账号管理</strong><span class="breadcrumb">网研ERP <span>/</span> 店铺 <span>/</span> 子账号管理</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page">
<div class="notice">权限由服务端强制校验；隐藏菜单不是唯一保护。修改权限后，子账号下一次请求立即按新权限执行。</div>
<div class="membership-quota-inline" id="childAccountQuota"></div>
<div class="filter-bar"><span id="summary">共 0 个账号</span><span class="spacer"></span><button class="btn btn-primary" id="createBtn">＋ 创建子账号</button></div>
<section class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>用户身份</th><th>显示名称</th><th>类型</th><th>状态</th><th>店铺范围</th><th>权限数量</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></section></main></div>
<dialog id="createDialog" class="ui-page"><form id="createForm"><div class="dh"><b>添加子账号</b><button type="button" class="icon-btn close-create">×</button></div><div class="db"><label class="field full">已注册邮箱<input class="input" id="cEmail" type="email" maxlength="240" required autocomplete="off"><span>该用户需先完成网研ERP邮箱注册；主账号无需也不能设置子账号密码。</span></label><label class="field">子账号名称<input class="input" id="cDisplayName" maxlength="120" placeholder="可重复，仅用于显示"></label><label class="field">店铺范围<select class="select" id="cScope"><option value="all">全部店铺</option><option value="selected">指定店铺（待配置）</option></select></label><div class="field full"><span>默认权限</span><span>查看店铺、订单、在线商品、采集箱和选品；添加后可继续配置权限。</span></div></div><div class="df"><button class="btn close-create" type="button">取消</button><button class="btn btn-primary">添加</button></div></form></dialog>
<dialog id="permissionDialog" class="ui-page"><form id="permissionForm"><div class="perm-head"><b id="permissionTitle">配置权限</b><span class="perm-count" id="permissionCount"></span><button type="button" class="icon-btn close-permission" aria-label="关闭">×</button></div><div class="perm-body"><section class="perm-section"><h3 class="perm-section-title">店铺范围</h3><label class="field">店铺范围<select class="select perm-scope-select" id="pScope"><option value="all">全部店铺</option><option value="selected">指定店铺</option></select></label><div class="perm-shops" id="shopScopeField"><span class="perm-hint">可访问店铺（未选择时将看不到店铺、订单和在售商品）</span><div class="perm-grid" id="shopList"></div></div></section><section class="perm-section"><h3 class="perm-section-title">功能权限</h3><div class="permission-list" id="permissionList"></div></section></div><div class="perm-foot"><button class="btn close-permission" type="button">取消</button><button class="btn btn-primary">保存权限</button></div></form></dialog>
<script src="../assets/brand.js?v=20260919-perm01"></script><script src="../assets/identity-display.js?v=20261006-id01"></script><script src="../assets/storage.js?v=20260919-perm01"></script><script src="../assets/membership-quota.js?v=20261005-quota01"></script><script src="../assets/sku-mask.js"></script><script src="../assets/table-pagination.js?v=20261002-b07b2"></script><script src="../assets/sidebar.js?v=20260919-perm01"></script><script>
(function(){'use strict';var members=[],catalog=[],shops=[],editingId='',skuMask=window.WYERP_SKU_MASK,quotaApi=window.WYERP_MEMBERSHIP_QUOTA,childQuota=null;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function request(url,opt){return erpStorage.request(url,opt).then(async function(r){var d=await r.json().catch(function(){return{};});if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;});}
function identityOf(v){return window.WYERP_IDENTITY_DISPLAY.displayIdentity(v||{});}
function applyChildQuota(payload){var q=payload&&payload.quotas&&payload.quotas.childAccounts;childQuota=q?Object.assign({},q):null;if(childQuota){quotaApi.render(document.getElementById('childAccountQuota'),childQuota,{compact:true,label:'子账号会员额度',note:'仅统计启用中的子账号'});var full=!childQuota.unlimited&&childQuota.limit!==null&&childQuota.usage>=childQuota.limit;createBtn.disabled=full;createBtn.title=full?'当前会员子账号额度已用完，请先停用子账号或升级会员':'';}else{createBtn.disabled=false;createBtn.title='';}}
function render(){summary.textContent='共 '+members.length+' 个账号';body.innerHTML=members.length?members.map(function(v){var owner=v.memberType==='owner',identity=identityOf(v),scope=v.shopScopeMode==='all'?'全部店铺':((v.shops||[]).length?(v.shops||[]).map(function(s){return s.name;}).join('、'):'未授权店铺');return'<tr><td><b class="username-ellipsis" title="'+esc(identity.raw)+'">'+esc(identity.masked)+'</b></td><td>'+esc(v.displayName||'--')+'</td><td>'+(owner?'主账号':'子账号')+'</td><td><span class="badge '+(v.status==='active'?'badge-green':'badge-gray')+'">'+(v.status==='active'?'启用':'停用')+'</span></td><td>'+esc(scope)+'</td><td>'+(owner?'全部':(v.permissions||[]).length)+'</td><td>'+esc(v.createdAt||'--')+'</td><td>'+(owner?'--':'<button class="link perm" data-id="'+v.userId+'">配置权限</button> <button class="link toggle" data-id="'+v.userId+'">'+(v.status==='active'?'停用':'启用')+'</button>')+'</td></tr>';}).join(''):'<tr><td colspan="8"><div class="empty">暂无账号</div></td></tr>';}
function load(){return Promise.all([request('/api/tenant/shops'),request('/api/tenant/members'),request('/api/tenant/permissions'),quotaApi.load().catch(function(){return null;})]).then(function(x){shops=x[0].items||[];members=x[1].items||[];catalog=x[2].items||[];applyChildQuota(x[3]);render();});}
function toggleShopScope(){shopScopeField.classList.toggle('hidden',pScope.value==='all');}
// 展示层映射：中文权限名为主标题，英文码弱化为次要小字；分组按接口 module 字段，未知模块归入“其他权限”。不改变权限模型与保存逻辑。
var PERMISSION_LABELS={'shops.read':'查看店铺','shops.write':'编辑店铺','shops.credentials.manage':'店铺凭证管理','orders.read':'查看订单','orders.write':'修改订单','orders.export':'导出订单','products.read':'查看在线商品','products.write':'修改在线商品','collection.read':'查看采集箱','collection.write':'管理采集箱','selection.read':'查看选品模块','selection.manage':'管理选品与收藏','analytics.read':'查看数据分析','analytics.fetch':'获取外部分析数据','promotions.read':'查看促销','promotions.write':'管理促销','messages.read':'查看消息','messages.write':'管理消息','dashboard.read':'查看数据大屏','tools.use':'使用定价与利润工具','sync.run':'发起同步','audit.read':'查看审计日志','overview.import':'导入大盘数据','tenant.members.read':'查看子账号','tenant.members.manage':'管理子账号','tenant.roles.read':'查看角色与权限','tenant.roles.manage':'配置角色与权限'};
var PERMISSION_GROUP_TITLES={orders:'订单',products:'在线商品',collection:'采集箱',selection:'选品',analytics:'数据分析',promotions:'促销',messages:'消息',dashboard:'数据大屏',tools:'工具',shops:'店铺',sync:'同步任务',audit:'审计日志',tenant:'账号与权限',overview:'大盘数据'};
var PERMISSION_GROUP_ORDER=['shops','orders','products','collection','selection','analytics','promotions','messages','dashboard','tools','sync','tenant','audit','overview'];
function permissionItemHtml(code,name,desc,codeText){return'<label class="perm-item" title="'+esc(codeText)+'"><input type="checkbox" value="'+esc(code)+'"><span class="perm-item-main"><span class="perm-item-name">'+esc(name)+'</span>'+(desc?'<span class="perm-item-desc">'+esc(desc)+'</span>':'')+(codeText?'<code class="perm-item-code">'+esc(codeText)+'</code>':'')+'</span></label>';}
function renderPermissionCatalog(){var byModule={};PERMISSION_GROUP_ORDER.forEach(function(m){byModule[m]=[];});catalog.forEach(function(p){var label=PERMISSION_LABELS[p.code],name=label||p.description||'其他权限',codeText=label?p.code:'',item=permissionItemHtml(p.code,name,label?p.description:'',codeText);if(byModule[p.module]){byModule[p.module].push(item);}else{(byModule.other=byModule.other||[]).push(item);}});var groups=PERMISSION_GROUP_ORDER.filter(function(m){return byModule[m]&&byModule[m].length;}).map(function(m){return{title:PERMISSION_GROUP_TITLES[m]||m,items:byModule[m]};});if(byModule.other&&byModule.other.length)groups.push({title:'其他权限',items:byModule.other});permissionList.innerHTML=groups.map(function(g){return'<div class="perm-group"><h4 class="perm-group-title">'+esc(g.title)+'</h4><div class="perm-grid">'+g.items.join('')+'</div></div>';}).join('');}
function updatePermissionCount(){var total=catalog.length,checked=permissionList.querySelectorAll('input:checked').length,shopTotal=shops.length,shopChecked=shopList.querySelectorAll('input:checked').length;permissionCount.textContent='已选 '+checked+'/'+total+' 项权限'+(shopTotal?' · 店铺 '+shopChecked+'/'+shopTotal:'');}
function openPermissions(v){var identity=identityOf(v);editingId=v.userId;permissionTitle.textContent='配置权限：'+identity.masked;permissionTitle.title=identity.raw;pScope.value=v.shopScopeMode||'selected';var selected=v.permissions||[],selectedShops=(v.shops||[]).map(function(s){return s.id;});renderPermissionCatalog();permissionList.querySelectorAll('input').forEach(function(i){i.checked=selected.indexOf(i.value)>=0;});shopList.innerHTML=shops.length?shops.map(function(s){var maskedShopId=s.externalShopId?skuMask.maskShopId(s.externalShopId):'';return permissionItemHtml(s.id,s.name,maskedShopId,s.externalShopId?'':'无平台店铺 ID');}).join(''):'<div class="perm-empty">请先在店铺管理中添加店铺。</div>';shopList.querySelectorAll('input').forEach(function(i){i.checked=selectedShops.indexOf(i.value)>=0;});updatePermissionCount();toggleShopScope();permissionDialog.showModal();}
permissionForm.addEventListener('change',updatePermissionCount);
body.onclick=function(e){var b=e.target.closest('button');if(!b)return;var v=members.find(function(x){return x.userId===b.dataset.id;});if(b.classList.contains('perm'))openPermissions(v);if(b.classList.contains('toggle')){request('/api/tenant/members/'+v.userId+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:v.status==='active'?'disabled':'active'})}).then(load).catch(function(err){alert(err.message);});}};
createBtn.onclick=function(){createForm.reset();createDialog.showModal();};document.querySelectorAll('.close-create').forEach(function(b){b.onclick=function(){createDialog.close();};});document.querySelectorAll('.close-permission').forEach(function(b){b.onclick=function(){permissionDialog.close();};});
pScope.onchange=toggleShopScope;
createForm.onsubmit=function(e){e.preventDefault();request('/api/tenant/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:cEmail.value,displayName:cDisplayName.value,shopScopeMode:cScope.value})}).then(function(){createDialog.close();return load();}).catch(function(err){alert(err.message);});};
permissionForm.onsubmit=function(e){e.preventDefault();var permissions=Array.from(permissionList.querySelectorAll('input:checked')).map(function(v){return v.value;}),shopIds=Array.from(shopList.querySelectorAll('input:checked')).map(function(v){return v.value;});request('/api/tenant/members/'+editingId+'/permissions',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({permissions:permissions,shopScopeMode:pScope.value,shopIds:shopIds})}).then(function(){permissionDialog.close();return load();}).catch(function(err){alert(err.message);});};
erpStorage.init([]).then(load).catch(function(err){body.innerHTML='<tr><td colspan="8"><div class="empty">'+esc(err.message)+'</div></td></tr>';});
})();</script></body></html>
