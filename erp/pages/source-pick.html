(function(){'use strict';var model=window.WYERP_PRODUCT_COLLECTION,list=[];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}function render(){var rows=model.filter(list,{keyword:keyword.value,status:status.value}).filter(function(v){return/1688/i.test(v.source)||/1688\.com/i.test(v.sourceUrl);});grid.innerHTML=rows.length?rows.map(function(v){var safe=window.WYERP_PRODUCT_SOURCE_LINK.safeSupplierUrl(v.sourceUrl);return'<article class="source-card">'+(v.image?'<img class="thumb" src="'+esc(v.image)+'" alt="" onerror="this.style.display=\'none\'">':'<div class="thumb"></div>')+window.WYERP_OZON_PRODUCT_LINK.titleHtml({ozonSku:v.ozonSku||v.ozon_sku||'',ozonUrl:v.ozonUrl||v.ozon_url||''},v.title||'未命名商品',{className:'name product-title-clamp-2 ozon-product-title-link'})+'<div class="meta">来源：'+esc(v.source||'1688')+'<br>SKU 数量：'+(v.skuCount==null?'--':v.skuCount)+' · 状态：'+esc(v.status)+'</div><div class="price">'+(v.price==null?'采集价 --':'¥ '+esc(v.price))+'</div><div class="actions">'+(safe?'<a class="btn" href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">打开 1688 货源</a>':'<span class="badge badge-gray">未录入货源地址</span>')+'</div></article>';}).join(''):'<div class="empty">暂无已采集的 1688 货源<br>请在采集箱手动录入真实商品与货源地址；本页不会展示模拟商品。</div>';}searchBtn.onclick=render;keyword.onkeydown=function(e){if(e.key==='Enter')render();};erpStorage.init(['erp_collected_products']).then(function(){list=model.normalizeAll(erpStorage.get('erp_collected_products'));render();});})();</script></body></html>
