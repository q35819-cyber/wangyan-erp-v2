<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号安全 - 网研ERP</title><link rel="stylesheet" href="../assets/style.css"><style>
.security-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1000px}.form{display:flex;flex-direction:column;gap:14px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.field .input{width:100%}.notice{padding:10px 14px;border-radius:6px;font-size:12px;line-height:1.7;background:var(--surface-hover);color:var(--muted)}.danger-card{border:1px solid color-mix(in srgb,var(--red) 35%,var(--line))}.result{min-height:20px;font-size:12px}.ok{color:var(--green)}.err{color:var(--red)}@media(max-width:800px){.security-grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="../assets/ui.css"><script src="../assets/theme-restore.js"></script></head><body><div class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></div><div class="main-content"><div class="header"><div class="header-left"><strong>账号安全</strong><span class="breadcrumb">网研ERP <span>/</span> 店铺 <span>/</span> 账号安全</span></div><div class="header-right"><span class="user-name">管理员</span><button class="icon-btn">🔔</button><span class="avatar">管</span></div></div><main class="content ui-page"><div class="security-grid"><section class="card"><div class="card-title"><span>修改登录密码</span></div><form class="form" id="passwordForm"><label class="field">当前密码<input class="input" id="currentPassword" type="password" minlength="6" maxlength="128" autocomplete="current-password" required></label><label class="field">新密码（至少 6 位）<input class="input" id="newPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label><label class="field">再次输入新密码<input class="input" id="confirmPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label><div class="notice">修改成功后，当前页面保持登录，该账号其他设备的会话会立即失效。</div><div class="result" id="passwordResult"></div><button class="btn btn-primary">确认修改</button></form></section><section class="card danger-card"><div class="card-title"><span>登录设备</span></div><div class="form"><div class="notice">退出全部设备会撤销当前账号的所有有效会话，包括本浏览器。不会影响同租户的其他子账号。</div><div class="result" id="logoutResult"></div><button class="btn btn-danger" id="logoutAllBtn">退出全部设备</button></div></section></div></main></div><script src="../assets/brand.js"></script><script src="../assets/storage.js"></script><script src="../assets/sidebar.js"></script><script>
(function(){'use strict';var csrf='';function request(url,body){return fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body||{})}).then(function(r){return r.json().catch(function(){return{};}).then(function(d){if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;});});}passwordForm.onsubmit=function(e){e.preventDefault();passwordResult.className='result';passwordResult.textContent='';if(newPassword.value!==confirmPassword.value){passwordResult.className='result err';passwordResult.textContent='两次输入的新密码不一致';return;}request('/api/auth/password',{currentPassword:currentPassword.value,newPassword:newPassword.value}).then(function(){passwordForm.reset();passwordResult.className='result ok';passwordResult.textContent='密码已修改，其他设备已退出。';}).catch(function(err){passwordResult.className='result err';passwordResult.textContent=err.message;});};logoutAllBtn.onclick=function(){if(!confirm('确定退出该账号的全部设备？'))return;request('/api/auth/logout-all',{}).then(function(){erpStorage.clearSessionScopedState();location.replace('/login.html');}).catch(function(err){logoutResult.className='result err';logoutResult.textContent=err.message;});};erpStorage.init([]).then(function(){return fetch('/api/auth/me',{credentials:'same-origin'});}).then(function(r){return r.json();}).then(function(me){csrf=me.csrfToken;});})();
</script></body></html>
