<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>工作台 - 网研ERP</title>
<link rel="stylesheet" href="assets/style.css?v=20261006-copy01">
<script src="assets/theme-restore.js?v=20260926-extreload1"></script>
</head>
<body class="workspace-shell">
  <aside class="sidebar"><div class="logo">网研<span>ERP</span></div><nav class="menu"></nav></aside>
  <div class="main-content">
    <header class="header">
      <div class="header-left"><strong id="workspaceTitle">概览</strong><span class="breadcrumb">网研ERP <span>/</span> <span id="workspaceBreadcrumb">概览</span></span></div>
      <div class="header-right">
        <div class="header-quick-actions" aria-label="快捷服务">
          <button class="header-quick-btn header-plugin-download" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/></svg>
            <span class="header-quick-label">下载浏览器插件</span>
          </button>
          <div class="header-support-item">
            <button class="header-quick-btn header-support-btn" type="button" aria-describedby="headerSupportHelp">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13a2 2 0 0 0 2 2h1v-4H6a2 2 0 0 1-2 2Zm16 0a2 2 0 0 1-2 2h-1v-4h1a2 2 0 0 1 2 2ZM17 17c-1 2-3 3-6 3"/></svg>
              <span class="header-quick-label">客服</span>
            </button>
            <div class="header-support-popover" id="headerSupportHelp" role="tooltip">
              <strong>问题反馈</strong>
              <p>如果有BUG，请在工具里面提交BUG反馈</p>
            </div>
          </div>
          <button class="header-quick-btn header-member-btn" id="headerMemberBtn" type="button" aria-label="打开会员中心">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18l-2 12H5L3 6Zm4 0 2 5 3-5 3 5 2-5M8 15h8"/></svg>
            <span class="header-member-copy"><span class="header-quick-label">会员状态读取中</span><span class="header-member-remaining" hidden></span></span>
          </button>
          <button class="header-quick-btn header-bean-btn" id="headerBeanBtn" type="button" aria-label="打开AI豆管理" title="打开AI豆管理：查看余额、消耗、充值、赠送和奖励流水">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10c0-1.5 1.3-2.5 3-2.5s3 1 3 2.5-3 1-3 3-3-1.5-3-3zM9 14c0 1.5 1.3 2.5 3 2.5s3-1 3-2.5-3-1-3-3-3 1.5-3 3z"/></svg>
            <span class="header-bean-value">—</span><span class="header-bean-label">豆</span>
          </button>
        </div>
        <span class="user-name">管理员</span><button class="icon-btn" type="button">🔔</button><span class="avatar">管</span>
      </div>
    </header>
    <nav class="workspace-tabs" id="workspaceTabs" aria-label="已打开功能"></nav>
    <main class="workspace-frame-deck" id="workspaceDeck"></main>
    <footer class="workspace-copyright" aria-label="版权信息"><span data-wyerp-copyright></span></footer>
  </div>
  <script src="assets/brand.js?v=20261006-copy01"></script>
  <script src="assets/storage.js?v=20260924-fv1"></script>
  <script src="assets/sidebar.js?v=20260925-embed1"></script>
  <script src="assets/workspace-tabs.js?v=20260925-embed4"></script>
  <script src="assets/workspace-header.js?v=20260926-csp1"></script>
</body>
</html>
